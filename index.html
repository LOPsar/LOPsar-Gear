}

function Phase2({ project, db, A, onBack, onNext }) {
  const [soloPend, setSoloPend] = useState(false);
  const entries = projectEntries(project, db);
  const pr = progress(project, db);
  if (entries.length === 0) return html`<${EmptyPhase} onBack=${onBack} />`;
  const done = (k) => !!(project.prep[k] && project.prep[k].done);
  const toggle = (k) => A.updateProject(project.id, (p) => ({ ...p, prep: { ...p.prep, [k]: { ...(p.prep[k] || {}), done: !(p.prep[k] && p.prep[k].done) } } }));
  const saveNote = (k, nota) => A.updateProject(project.id, (p) => ({ ...p, prep: { ...p.prep, [k]: { ...(p.prep[k] || {}), nota } } }));
  const setAll = (on) => A.updateProject(project.id, (p) => { const prep = { ...p.prep }; entries.forEach((e) => { prep[e.key] = { ...(prep[e.key] || {}), done: on }; }); return { ...p, prep }; });
  const vis = soloPend ? entries.filter((e) => !done(e.key)) : entries;
  const groups = groupBy(vis, (e) => e.item.categoria);
  return html`<div>
    <div className=${cn(CARD, 'mb-4 p-4 sm:p-5')}>
      <div className="mb-3 flex flex-wrap items-end justify-between gap-2"><div className="font-display text-3xl font-bold uppercase leading-none sm:text-4xl"><span className="num text-amber-400">${pr.prep}</span> de <span className="num">${pr.total}</span> equipos empacados</div><div className="num font-display text-4xl font-bold text-amber-400">${pct(pr.prep, pr.total)}%</div></div>
      <${Bar} value=${pr.prep} total=${pr.total} big />
      <label className="mt-4 flex min-h-[44px] cursor-pointer items-center gap-3"><input id="solo-pend" type="checkbox" checked=${soloPend} onChange=${(e) => setSoloPend(e.target.checked)} className="h-6 w-6 accent-amber-500" /><span>Mostrar solo pendientes de empacar</span></label>
      <div className="mt-3 flex flex-wrap gap-2"><button onClick=${() => setAll(true)} disabled=${pr.prep === pr.total} className=${B_GHOST}><${Icon} name="ListChecks" size=${16} />Marcar todos listos</button><button onClick=${() => setAll(false)} disabled=${pr.prep === 0} className=${B_GHOST}><${Icon} name="RotateCcw" size=${16} />Desmarcar todos</button></div>
    </div>
    ${pr.prep === pr.total && html`<div className="mb-4 rounded-md border border-emerald-500/40 bg-emerald-500/10 px-4 py-3 font-semibold text-emerald-300">Maleta completa. Todo el equipo está empacado.</div>`}
    ${vis.length === 0 && html`<${Empty} icon="PackageCheck" title="Nada pendiente" text="Todos los equipos ya están en la maleta." />`}
    ${groups.map(([cat, items]) => html`<section key=${cat} className="mb-5"><h2 className="lbl mb-2 flex items-center gap-2"><span className="h-px w-4 bg-amber-500"></span>${cat}</h2>
      <ul className="flex flex-col gap-3">${items.map((e) => {
        const ok = done(e.key); const nota = project.prep[e.key] && project.prep[e.key].nota;
        return html`<li key=${e.key} className=${cn('rounded-md border-2 p-3 sm:p-4', ok ? 'border-emerald-500/50 bg-emerald-500/5' : 'border-slate-700 bg-slate-800')}>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex min-w-0 flex-1 items-start gap-3"><${Thumb} item=${e.item} size=${44} /><div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><span className="num rounded bg-slate-900 px-2 py-0.5 font-mono text-xs">${e.qty}x</span><span className="text-base font-semibold">${e.item.nombre}</span>${e.item._renta && html`<span className="rounded border border-sky-500/50 px-2 py-0.5 text-[11px] font-semibold text-sky-300">RENTA</span>`}</div><div className="text-xs text-slate-400">${[e.item.marca, e.item.modelo].filter(Boolean).join(' · ')}</div></div></div>
            <button onClick=${() => toggle(e.key)} aria-pressed=${ok} className=${cn('min-h-[56px] w-full rounded-md px-5 text-base font-bold tracking-wide sm:w-56', ok ? 'bg-emerald-500 text-slate-950' : 'border-2 border-amber-500 text-amber-400 hover:bg-amber-500/10')}>${ok ? 'LISTO EN MALETA' : 'PENDIENTE'}</button>
          </div>
          <div className="mt-3"><${NoteField} id=${'prep-note-' + e.key} rows=${1} value=${nota} onSave=${(v) => saveNote(e.key, v)} placeholder="Nota de preparación (ej. Batería cargada al 100%)" /></div>
        </li>`; })}</ul></section>`)}
    <div className="mt-2 flex flex-wrap justify-between gap-3"><button onClick=${onBack} className=${B_GHOST}><${Icon} name="ChevronLeft" size=${16} />Selección</button><button onClick=${onNext} className=${B_PRIMARY}>Siguiente: modo WRAP<${Icon} name="ChevronRight" size=${16} /></button></div>
  </div>`;
}

const WSTAT = {
  ok: { label: 'RECOGIDO OK', on: 'bg-emerald-500 text-slate-950 border-emerald-400', border: 'border-emerald-500', band: 'bg-emerald-500' },
  dano: { label: 'CON DETALLE / DAÑO', on: 'bg-amber-500 text-slate-950 border-amber-400', border: 'border-amber-500', band: 'bg-amber-500' },
  faltante: { label: 'FALTANTE / EXTRAVIADO', on: 'bg-red-600 text-white border-red-400', border: 'border-red-500', band: 'bg-red-500' },
};
function Phase3({ project, db, A, onBack, showToast }) {
  const [soloPend, setSoloPend] = useState(false);
  const [confirmClose, setConfirmClose] = useState(false);
  const entries = projectEntries(project, db);
  const pr = progress(project, db);
  if (entries.length === 0) return html`<${EmptyPhase} onBack=${onBack} />`;
  const st = (k) => (project.wrap[k] && project.wrap[k].status) || '';
  const setStatus = (k, s) => A.updateProject(project.id, (p) => { const cur = p.wrap[k] || {}; return { ...p, wrap: { ...p.wrap, [k]: { ...cur, status: cur.status === s ? '' : s } } }; });
  const saveNote = (k, nota) => A.updateProject(project.id, (p) => ({ ...p, wrap: { ...p.wrap, [k]: { ...(p.wrap[k] || {}), nota } } }));
  const vis = soloPend ? entries.filter((e) => !st(e.key)) : entries;
  const groups = groupBy(vis, (e) => e.item.categoria);
  const pend = pr.total - pr.wrap;
  const nInv = entries.filter((e) => !e.item._renta && (st(e.key) === 'dano' || st(e.key) === 'faltante')).length;
  const sync = () => { A.syncProject(project.id, false); showToast(nInv > 0 ? nInv + ' equipo(s) marcados como Requiere revisión en el inventario' : 'Inventario sincronizado'); };
  const close = () => { A.syncProject(project.id, true); setConfirmClose(false); showToast('Rodaje cerrado e inventario actualizado'); };
  const finalizado = project.estado === 'Finalizado';

  return html`<div className="rounded-md border-2 border-slate-500 bg-slate-950 p-3 sm:p-5">
    <div className="mb-4">
      <div className="mb-3 flex flex-wrap items-end justify-between gap-2"><div className="font-display text-3xl font-bold uppercase leading-none text-white sm:text-4xl"><span className="num text-emerald-400">${pr.wrap}</span> de <span className="num">${pr.total}</span> equipos verificados en wrap</div><div className="num font-display text-4xl font-bold text-emerald-400">${pct(pr.wrap, pr.total)}%</div></div>
      <${Bar} value=${pr.wrap} total=${pr.total} tone="emerald" big />
      <div className="mt-3 flex flex-wrap gap-2 text-sm font-semibold">
        <span className="rounded border border-emerald-500/60 px-2.5 py-1 text-emerald-300">${entries.filter((e) => st(e.key) === 'ok').length} OK</span>
        <span className="rounded border border-amber-500/60 px-2.5 py-1 text-amber-300">${pr.dano} con daño</span>
        <span className="rounded border border-red-500/60 px-2.5 py-1 text-red-300">${pr.falt} faltantes</span>
        <span className="rounded border border-slate-500 px-2.5 py-1 text-slate-200">${pend} sin verificar</span>
      </div>
      <label className="mt-4 flex min-h-[44px] cursor-pointer items-center gap-3 text-white"><input id="solo-sin" type="checkbox" checked=${soloPend} onChange=${(e) => setSoloPend(e.target.checked)} className="h-6 w-6 accent-emerald-500" /><span>Mostrar solo equipos sin verificar</span></label>
    </div>
    ${pr.falt > 0 && html`<div className="mb-4 rounded-md border-2 border-red-500 bg-red-600/20 px-4 py-3 font-bold text-red-200">ALERTA: ${pr.falt} equipo(s) no aparecen en el set. Revisa la locación antes de irte.</div>`}
    ${finalizado && html`<div className="mb-4 rounded-md border border-emerald-500/50 bg-emerald-500/10 px-4 py-3 text-emerald-300">Este rodaje está cerrado. Puedes seguir ajustando y volver a sincronizar.</div>`}
    ${vis.length === 0 && html`<${Empty} icon="ClipboardCheck" title="Todo verificado" text="Ya marcaste el estado de cada equipo." />`}
    ${groups.map(([cat, items]) => html`<section key=${cat} className="mb-5"><h2 className="lbl mb-2 !text-slate-300">${cat}</h2>
      <ul className="flex flex-col gap-3">${items.map((e) => {
        const s = st(e.key); const w = project.wrap[e.key] || {};
        return html`<li key=${e.key} className=${cn('flex overflow-hidden rounded-md border-2 bg-black', s ? WSTAT[s].border : 'border-slate-600')}>
          <div className=${cn('w-2 shrink-0', s ? WSTAT[s].band : 'bg-slate-700')}></div>
          <div className="min-w-0 flex-1 p-3 sm:p-4">
            <div className="flex flex-wrap items-center gap-2"><span className="num rounded bg-slate-800 px-2 py-0.5 font-mono text-xs text-white">${e.qty}x</span><span className="text-lg font-bold text-white">${e.item.nombre}</span>${e.item._renta && html`<span className="rounded border border-sky-500/60 px-2 py-0.5 text-[11px] font-semibold text-sky-300">RENTA · ${e.item.casa}</span>`}</div>
            <div className="text-xs text-slate-400">${[e.item.marca, e.item.modelo].filter(Boolean).join(' · ')}</div>
            <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-3">${['ok', 'dano', 'faltante'].map((k) => html`<button key=${k} onClick=${() => setStatus(e.key, k)} aria-pressed=${s === k} className=${cn('min-h-[56px] rounded-md border-2 px-3 text-sm font-bold tracking-wide', s === k ? WSTAT[k].on : 'border-slate-500 bg-slate-900 text-white hover:bg-slate-800')}>${WSTAT[k].label}</button>`)}</div>
            ${(s === 'dano' || s === 'faltante') && html`<div className="mt-3"><label htmlFor=${'wrap-note-' + e.key} className="lbl mb-1 block !text-slate-300">${s === 'dano' ? (e.item._renta ? 'Qué pasó (avisa a la casa de renta al devolverlo)' : 'Qué pasó (pasa al inventario como Requiere revisión)') : 'Dónde se vio por última vez'}</label><${NoteField} id=${'wrap-note-' + e.key} autoFocus=${!w.nota} value=${w.nota} onSave=${(v) => saveNote(e.key, v)} placeholder=${s === 'dano' ? 'Ej. Se dobló un tornillo / se perdió la tapa del lente' : 'Ej. Última vez en la cocina, toma 12'} /></div>`}
          </div>
        </li>`; })}</ul></section>`)}

    <div className="sticky bottom-0 -mx-3 mt-4 flex flex-col gap-3 border-t-2 border-slate-600 bg-slate-950 px-3 py-3 sm:-mx-5 sm:px-5" style=${{ paddingBottom: 'calc(12px + env(safe-area-inset-bottom,0px))' }}>
      ${confirmClose && html`<div className="rounded-md border-2 border-amber-500 bg-amber-500/10 p-3 text-amber-200">Quedan ${pend} equipo(s) sin verificar. ¿Cerrar el rodaje de todos modos?
        <div className="mt-2 flex flex-wrap gap-2"><button onClick=${close} className=${B_PRIMARY}>Cerrar de todos modos</button><button onClick=${() => setConfirmClose(false)} className=${B_GHOST}>Seguir verificando</button></div></div>`}
      <div className="flex flex-wrap justify-between gap-3">
        <button onClick=${onBack} className=${B_GHOST}><${Icon} name="ChevronLeft" size=${16} />PREP</button>
        <div className="flex flex-wrap gap-3">
          <button onClick=${sync} className=${B_GHOST}><${Icon} name="Database" size=${16} />Sincronizar con inventario</button>
          <button onClick=${() => (pend > 0 ? setConfirmClose(true) : close())} className=${B_OK}><${Icon} name="Check" size=${16} />Guardar y cerrar rodaje</button>
        </div>
      </div>
    </div>
  </div>`;
}

        ${project.estado === 'Finalizado' && html`<button onClick=${() => A.updateProject(project.id, { estado: 'Activo' })} className="flex min-h-[40px] items-center gap-1.5 px-2 text-sm text-slate-300 hover:text-amber-400"><${Icon} name="RotateCcw" size=${15} />Reabrir rodaje</button>`}

/* ---------- RESPALDO ---------- */
function DataModal({ db, onClose, A, showToast, S }) {
  const json = useMemo(() => JSON.stringify({ app: 'inventario-rodaje', version: 1, exportadoEn: new Date().toISOString(), inventory: db.inventory, projects: db.projects, loans: db.loans, personas: db.personas, casas: db.casas, kits: db.kits, categorias: db.categorias, yo: db.yo }, null, 2), [db]);
  const ta = useRef(null);
  const [paste, setPaste] = useState('');
  const [err, setErr] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const [cloudConfirm, setCloudConfirm] = useState('');
  const [cloudBusy, setCloudBusy] = useState(false);
  const doUp = async () => {
    setCloudBusy(true);
    try { await S.upload(); showToast('Datos subidos a la nube'); setCloudConfirm(''); }
    catch (e) { showToast('No se pudo subir: ' + cloudMsg(e)); }
    setCloudBusy(false);
  };
  const doDown = async () => {
    setCloudBusy(true);
    try { await S.download(); showToast('Datos descargados de la nube'); onClose(); return; }
    catch (e) { showToast('No se pudo descargar: ' + cloudMsg(e)); }
    setCloudBusy(false);
  };
  const copy = async () => { const ok = await copyText(json, ta); showToast(ok ? 'Respaldo copiado. Guárdalo en un archivo .json' : 'Texto seleccionado: usa Copiar de tu dispositivo'); };
  const doImport = (text) => {
    try {
      const n = normalizeDb(JSON.parse(text));
      if (!n) throw new Error('formato');
      A.replaceAll(n); showToast('Respaldo importado: ' + n.inventory.length + ' equipos, ' + n.projects.length + ' proyectos, ' + n.kits.length + ' kits'); onClose();
    } catch (e) { setErr('Ese texto no es un respaldo válido. Usa el JSON exportado desde esta app.'); }
  };
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => doImport(String(r.result || ''));
    r.onerror = () => setErr('No se pudo leer el archivo.');
    r.readAsText(file);
  };
  return html`<${Modal} title="Respaldo de datos" onClose=${onClose} wide>
    <section className="mb-6 rounded-md border border-sky-500/30 bg-sky-500/5 p-4"><h3 className="mb-1 font-display text-xl font-semibold uppercase">Nube (Firebase)</h3>
      ${!S.user ? html`<p className="mb-3 text-sm text-slate-400">Inicia sesión para sincronizar entre tu celular y tu computadora.</p><button onClick=${() => { onClose(); S.openAuth(); }} className=${B_PRIMARY}><${Icon} name="LogIn" size=${16} />Iniciar Sesión / Sincronizar</button>` : html`
        <p className="mb-3 text-sm text-slate-400">Conectado como <span className="font-mono text-slate-200">${S.user.email}</span>. Los cambios ya se sincronizan solos; estos botones sirven para forzar una dirección.</p>
        <div className="flex flex-col gap-3">
          ${cloudConfirm === 'up' ? html`<div className="rounded-md border-2 border-amber-500 bg-amber-500/10 p-3 text-sm text-amber-200">Esto reemplaza los datos de la nube con los de este dispositivo (también en tus otros dispositivos).<div className="mt-2 flex flex-wrap gap-2"><button disabled=${cloudBusy} onClick=${doUp} className=${B_PRIMARY}>${cloudBusy ? 'Subiendo…' : 'Sí, subir'}</button><button disabled=${cloudBusy} onClick=${() => setCloudConfirm('')} className=${B_GHOST}>Cancelar</button></div></div>` : html`<button onClick=${() => setCloudConfirm('up')} className=${cn(B_GHOST, 'justify-start')}>☁️ Subir datos de este dispositivo a la nube</button>`}
          ${cloudConfirm === 'down' ? html`<div className="rounded-md border-2 border-amber-500 bg-amber-500/10 p-3 text-sm text-amber-200">Esto reemplaza los datos de este dispositivo con los de la nube.<div className="mt-2 flex flex-wrap gap-2"><button disabled=${cloudBusy} onClick=${doDown} className=${B_PRIMARY}>${cloudBusy ? 'Descargando…' : 'Sí, descargar'}</button><button disabled=${cloudBusy} onClick=${() => setCloudConfirm('')} className=${B_GHOST}>Cancelar</button></div></div>` : html`<button onClick=${() => setCloudConfirm('down')} className=${cn(B_GHOST, 'justify-start')}>📥 Descargar datos de la nube a este dispositivo</button>`}
        </div>`}
    </section>
    <section className="mb-6 border-t border-slate-700 pt-5"><h3 className="mb-1 font-display text-xl font-semibold uppercase">Exportar respaldo (JSON)</h3>

    <section className="mb-6 border-t border-slate-700 pt-5"><h3 className="mb-1 font-display text-xl font-semibold uppercase">Tu nombre</h3>
      <p className="mb-3 text-sm text-slate-400">Es el nombre con el que apareces como dueño de tus equipos (se usa para saber cuáles tienes tú y cuáles un socio). Se llena solo con tu primer equipo; aquí puedes cambiarlo.</p>
      <input aria-label="Tu nombre" className=${INPUT} defaultValue=${db.yo} onBlur=${(e) => { if (e.target.value.trim() !== (db.yo || '')) { A.setYo(e.target.value); showToast('Nombre guardado'); } }} placeholder="Tu nombre" /></section>
    <section className="mb-6 border-t border-slate-700 pt-5"><h3 className="mb-1 font-display text-xl font-semibold uppercase">Importar respaldo (JSON)</h3>
      <p className="mb-3 text-sm text-slate-400">Reemplaza todos los datos actuales (y los de la nube si tienes sesión iniciada). Elige un archivo o pega el texto.</p>

      <p className="mb-3 text-sm text-slate-400">Deja la app completamente en blanco: borra equipos, proyectos, préstamos y kits. Si tienes sesión iniciada, también se vacía en la nube. Exporta un respaldo antes.</p>
      ${confirmReset ? html`<div className="flex flex-wrap gap-2"><button onClick=${() => { A.replaceAll(freshDb()); showToast('Datos vaciados'); onClose(); }} className=${B_DANGER}>Sí, borrar todo</button><button onClick=${() => setConfirmReset(false)} className=${B_GHOST}>Cancelar</button></div>` : html`<button onClick=${() => setConfirmReset(true)} className=${B_DANGER}><${Icon} name="RotateCcw" />Restaurar datos de fábrica</button>`}</section>
  <//>`;

/* ---------- NUBE: indicador, barra y cuenta ---------- */
const SYNC_UI = {
  local: { text: '⚪ Modo Local', cls: 'border-slate-500/50 bg-slate-500/10 text-slate-300' },
  saving: { text: '🟡 Guardando...', cls: 'border-amber-500/50 bg-amber-500/10 text-amber-300' },
  synced: { text: '🟢 Nube Sincronizada', cls: 'border-emerald-500/50 bg-emerald-500/10 text-emerald-300' },
  offline: { text: '⚪ Sin conexión', cls: 'border-slate-500/50 bg-slate-500/10 text-slate-300' },
  error: { text: '🔴 Error de sincronización', cls: 'border-red-500/50 bg-red-500/10 text-red-300' },
};
function CloudBar({ status, user, msg, onOpen }) {
  const hubBtn = HUB.url ? html`<a href=${HUB.url} className=${cn(B_GHOST, '!min-h-[40px] mr-auto text-sm no-underline')}><${Icon} name="ArrowLeft" size=${16} />${HUB.name}</a>` : null;
  const s = SYNC_UI[status] || SYNC_UI.local;
  return html`<div className="mb-4 flex flex-wrap items-center justify-end gap-2" role="region" aria-label="Sincronización en la nube">
    ${hubBtn}
    <span role="status" aria-live="polite" className=${cn('inline-flex min-h-[40px] items-center rounded-full border px-3 text-xs font-semibold', s.cls)}>${s.text}</span>
    <button onClick=${onOpen} className=${cn(user ? B_GHOST : B_PRIMARY, '!min-h-[40px] text-sm')}><${Icon} name=${user ? 'User' : 'LogIn'} size=${16} />${user ? 'Mi cuenta' : 'Iniciar Sesión / Sincronizar'}</button>
    ${status === 'error' && msg && html`<p className="w-full text-right text-xs text-red-300">${msg}</p>`}
  </div>`;
}

function AuthModal({ user, fbState, status, msg, onClose, onOut, showToast }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const st = SYNC_UI[status] || SYNC_UI.local;
  const submit = async (e) => {
    e.preventDefault();
    if (!window.FB) return setErr('Firebase todavía no está disponible.');
    if (!email.trim()) return setErr('Escribe tu correo.');
    if (pass.length < 6) return setErr('La contraseña debe tener al menos 6 caracteres.');
    setBusy(true); setErr('');
    try {
      if (mode === 'signup') await window.FB.signUp(email.trim(), pass); else await window.FB.signIn(email.trim(), pass);
      showToast(mode === 'signup' ? 'Cuenta creada. Sincronizando…' : 'Sesión iniciada. Sincronizando…');
      onClose();
    } catch (x) { setErr(authMsg(x)); setBusy(false); }
  };
  const google = async () => {
    if (!window.FB) return setErr('Firebase todavía no está disponible.');
    setBusy(true); setErr('');
    try { const r = await window.FB.google(); if (r === 'redirect') return; showToast('Sesión iniciada. Sincronizando…'); onClose(); }
    catch (x) { setErr(authMsg(x)); setBusy(false); }
  };
  if (user) return html`<${Modal} title="Cuenta y nube" onClose=${onClose}>
    <div className="flex flex-col gap-4">
      <div className=${cn(CARD, 'p-4')}><div className="lbl mb-1">Sesión iniciada como</div><div className="break-all font-mono text-base text-slate-100">${user.email}</div></div>
      <div role="status" className=${cn('rounded-md border px-3 py-2 text-sm font-semibold', st.cls)}>${st.text}</div>
      ${msg && html`<p className="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">${msg}</p>`}
      <p className="text-sm text-slate-400">Los cambios se guardan solos en la nube y aparecen en tus otros dispositivos sin recargar. Siempre queda también una copia en este navegador.</p>
      <div className="flex flex-wrap justify-end gap-3"><button onClick=${onClose} className=${B_GHOST}>Cerrar</button><button onClick=${onOut} className=${B_DANGER}><${Icon} name="LogOut" size=${16} />Cerrar Sesión</button></div>
    </div><//>`;
  return html`<${Modal} title="Cuenta y nube" onClose=${onClose}>
    <form onSubmit=${submit} className="flex flex-col gap-4">
      <p className="text-sm text-slate-400">Inicia sesión para sincronizar el inventario entre tu celular y tu computadora. La primera vez en un dispositivo, si la nube aún está vacía, se suben los datos que ya tienes aquí.</p>
      <button type="button" onClick=${google} disabled=${busy || fbState !== 'ready'} className="inline-flex min-h-[48px] items-center justify-center gap-3 rounded-md bg-white px-4 text-sm font-semibold text-slate-800 hover:bg-slate-100 disabled:opacity-50"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continuar con Google</button>
      <div className="flex items-center gap-3 text-xs text-slate-500" aria-hidden="true"><span className="h-px flex-1 bg-slate-700"></span>o con correo<span className="h-px flex-1 bg-slate-700"></span></div>
      <div className="grid grid-cols-2 gap-2" role="group" aria-label="Modo de acceso">
        ${[['login', 'Iniciar Sesión'], ['signup', 'Crear Cuenta']].map(([k, l]) => html`<button key=${k} type="button" onClick=${() => { setMode(k); setErr(''); }} aria-pressed=${mode === k} className=${cn('min-h-[48px] rounded-md border-2 px-2 text-sm font-semibold', mode === k ? 'border-amber-500 bg-amber-500 text-slate-950' : 'border-slate-600 text-slate-300 hover:bg-slate-700/60')}>${l}</button>`)}
      </div>
      <${Field} id="a-mail" label="Correo"><input id="a-mail" type="email" inputMode="email" autoComplete="email" autoFocus className=${INPUT} value=${email} onChange=${(e) => setEmail(e.target.value)} placeholder="tu@correo.com" /><//>
      <${Field} id="a-pass" label="Contraseña" hint=${mode === 'signup' ? 'Mínimo 6 caracteres.' : ''}><input id="a-pass" type="password" autoComplete=${mode === 'signup' ? 'new-password' : 'current-password'} className=${INPUT} value=${pass} onChange=${(e) => setPass(e.target.value)} /><//>
      ${fbState === 'loading' && html`<p className="rounded-md border border-slate-600 px-3 py-2 text-sm text-slate-300">Cargando Firebase…</p>`}
      ${fbState === 'error' && html`<p className="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">No se pudo cargar Firebase (¿sin internet?). Sigues en Modo Local.</p>`}
      ${err && html`<p className="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">${err}</p>`}
      <div className="flex flex-wrap justify-end gap-3"><button type="button" onClick=${onClose} className=${B_GHOST}>Cancelar</button><button type="submit" disabled=${busy || fbState !== 'ready'} className=${B_PRIMARY}><${Icon} name="LogIn" size=${16} />${busy ? 'Conectando…' : (mode === 'signup' ? 'Crear Cuenta' : 'Iniciar Sesión')}</button></div>
    </form><//>`;
}

/* ---------- APP ---------- */
function App() {
  const [db, setDb] = useState(loadDb);
  ME = db.yo || '';
  const [nav, setNav] = useState({ view: 'dash', projectId: null, phase: 1 });
  const [filters, setFilters] = useState({ q: '', cat: '', estado: '', prop: '' });
  const [edit, setEdit] = useState(null);
  const [openNew, setOpenNew] = useState(false);
  const [dataOpen, setDataOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [storageOk, setStorageOk] = useState(true);
  const toastTimer = useRef(null);

  /* ---- Nube (Firebase) ---- */
  const [fbState, setFbState] = useState(window.FB ? 'ready' : (window.FB_ERROR ? 'error' : 'loading'));
  const [user, setUser] = useState(null);
  const [sync, setSync] = useState('local');
  const [syncMsg, setSyncMsg] = useState('');
  const [online, setOnline] = useState(navigator.onLine !== false);
  const [authOpen, setAuthOpen] = useState(false);
  const dbRef = useRef(db); dbRef.current = db;
  const userRef = useRef(null); userRef.current = user;
  const skipSave = useRef(false);   // el próximo cambio de db vino de la nube: no volver a subirlo
  const syncReady = useRef(false);  // ya se leyó la nube tras iniciar sesión
  const lastStamp = useRef('');
  const pending = useRef(0);
  const saveTimer = useRef(null);

  const push = (data) => {
    const u = userRef.current;
    if (!u || !window.FB) return Promise.reject({ code: 'no-user', message: 'No hay sesión iniciada.' });
    const stamp = DEVICE + '-' + Date.now();
    lastStamp.current = stamp; pending.current++;
    setSync('saving');
    return window.FB.save(u.uid, data, DEVICE, stamp).then(() => {
      pending.current--;
      if (pending.current === 0 && !saveTimer.current) { setSync('synced'); setSyncMsg(''); }
    }, (e) => { pending.current--; setSync('error'); setSyncMsg(cloudMsg(e)); throw e; });
  };

  useEffect(() => {
    const on = () => setFbState(window.FB ? 'ready' : 'error');
    window.addEventListener('fb-ready', on);
    if (window.FB || window.FB_ERROR) on();
    const up = () => setOnline(true), down = () => setOnline(false);
    window.addEventListener('online', up); window.addEventListener('offline', down);
    return () => { window.removeEventListener('fb-ready', on); window.removeEventListener('online', up); window.removeEventListener('offline', down); };
  }, []);

  useEffect(() => {
    if (fbState !== 'ready') return undefined;
    return window.FB.onAuth((u) => {
      setUser(u ? { uid: u.uid, email: u.email || '' } : null);
      if (!u && HUB.required && HUB.url) location.replace(HUB.url + (HUB.url.includes('?') ? '&' : '?') + 'next=' + encodeURIComponent(location.href));
    });
  }, [fbState]);

  // Escucha en vivo el documento users/{uid}
  useEffect(() => {
    syncReady.current = false; clearTimeout(saveTimer.current); saveTimer.current = null; pending.current = 0;
    if (!user || fbState !== 'ready') { setSync('local'); setSyncMsg(''); return undefined; }
    setSync('saving'); setSyncMsg('');
    const unsub = window.FB.watch(user.uid, (snap) => {
      const md = snap.metadata;
      if (!snap.exists()) {
        if (md.fromCache) return;               // sin confirmación del servidor: no se sube nada todavía
        if (!syncReady.current) { syncReady.current = true; push(dbRef.current).catch(() => {}); }  // primer inicio: sube lo local
        return;
      }
      if (md.hasPendingWrites) return;          // eco de nuestra propia escritura
      const data = snap.data();
      if (!(data.writer === DEVICE && data.stamp === lastStamp.current)) {
        const n = normalizeDb(data);
        if (!n) { setSync('error'); setSyncMsg('Los datos de la nube no tienen un formato válido.'); return; }
        if (stable(coreDb(n)) !== stable(coreDb(dbRef.current))) {
          if (!syncReady.current) { try { localStorage.setItem(KEY + '.respaldo-previo', JSON.stringify(dbRef.current)); } catch (e) { /* sin espacio */ } }
          skipSave.current = true; setDb(n);
        }
      }
      syncReady.current = true;
      if (!md.fromCache && pending.current === 0 && !saveTimer.current) { setSync('synced'); setSyncMsg(''); }
    }, (e) => { setSync('error'); setSyncMsg(cloudMsg(e)); });
    return () => unsub();
  }, [user ? user.uid : '', fbState]);

  // Respaldo local siempre + subida a la nube (con pequeña espera para agrupar cambios)
  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify(db)); setStorageOk(true); } catch (e) { setStorageOk(false); }
    if (skipSave.current) { skipSave.current = false; return undefined; }
    if (!userRef.current || !window.FB || !syncReady.current) return undefined;
    setSync('saving');
    saveTimer.current = setTimeout(() => { saveTimer.current = null; push(dbRef.current).catch(() => {}); }, 600);
    return () => { clearTimeout(saveTimer.current); saveTimer.current = null; };
  }, [db]);
  useEffect(() => { window.scrollTo(0, 0); }, [nav.view, nav.projectId, nav.phase]);

  const showToast = (msg) => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 3200); };
  const go = (view, opts) => { setNav({ view, projectId: null, phase: 1 }); if (opts && opts.newProject) setOpenNew(true); };
  const openProject = (id, phase) => setNav({ view: 'proj', projectId: id, phase: phase || 1 });

  const A = {
    updateItem: (id, patch) => setDb((d) => ({ ...d, inventory: d.inventory.map((i) => (i.id === id ? { ...i, ...patch } : i)) })),
    setEstado: (id, estado) => setDb((d) => ({ ...d, inventory: d.inventory.map((i) => (i.id === id ? { ...i, estado } : i)) })),
    addItem: (it) => setDb((d) => ({ ...d, inventory: [...d.inventory, it], yo: d.yo || (it.duenos && it.duenos[0] && it.tipoProp !== 'prestamo' ? it.duenos[0].nombre : '') })),
    setYo: (n) => setDb((d) => { const yo = String(n || '').replace(/\s+/g, ' ').trim(); return { ...d, yo, personas: yo && !d.personas.some((x) => normName(x) === normName(yo)) ? [...d.personas, yo] : d.personas }; }),
    addCategoria: (n) => setDb((d) => { const c = String(n || '').replace(/\s+/g, ' ').trim(); return !c || d.categorias.some((x) => normName(x) === normName(c)) ? d : { ...d, categorias: [...d.categorias, c] }; }),
    deleteCategoria: (c) => setDb((d) => ({ ...d, categorias: d.categorias.filter((x) => x !== c) })),
    renameCategoria: (o, n) => setDb((d) => { const c = String(n || '').replace(/\s+/g, ' ').trim(); if (!c || c === o || d.categorias.some((x) => x !== o && normName(x) === normName(c))) return d; return { ...d, categorias: d.categorias.map((x) => (x === o ? c : x)), inventory: d.inventory.map((i) => (i.categoria === o ? { ...i, categoria: c } : i)), projects: d.projects.map((p) => ({ ...p, renta: (p.renta || []).map((r) => (r.categoria === o ? { ...r, categoria: c } : r)) })) }; }),
    deleteItem: (id) => setDb((d) => ({ ...d, inventory: d.inventory.filter((i) => i.id !== id) })),
    resolveItem: (id) => setDb((d) => ({ ...d, inventory: d.inventory.map((i) => (i.id === id ? { ...i, mant: '', estado: i.estado === E_REV ? E_HOME : i.estado } : i)) })),
    setHolder: (id, who) => setDb((d) => ({ ...d, inventory: d.inventory.map((i) => (i.id === id ? { ...i, estado: who === 'socio' ? E_PARTNER : (i.estado === E_PARTNER ? E_HOME : i.estado) } : i)) })),
    addLoan: (l) => setDb((d) => ({ ...d, loans: [...d.loans, l] })),
    addPersona: (n) => setDb((d) => (d.personas.some((x) => normName(x) === normName(n)) ? d : { ...d, personas: [...d.personas, String(n).replace(/\s+/g, ' ').trim()] })),
    addCasa: (n) => setDb((d) => (d.casas.some((x) => normName(x) === normName(n)) ? d : { ...d, casas: [...d.casas, String(n).replace(/\s+/g, ' ').trim()] })),
    removeLoan: (id) => setDb((d) => ({ ...d, loans: d.loans.filter((l) => l.id !== id) })),
    addProject: (p) => setDb((d) => ({ ...d, projects: [p, ...d.projects] })),
    deleteProject: (id) => setDb((d) => ({ ...d, projects: d.projects.filter((p) => p.id !== id) })),
    updateProject: (id, fn) => setDb((d) => ({ ...d, projects: d.projects.map((p) => (p.id === id ? (typeof fn === 'function' ? fn(p) : { ...p, ...fn }) : p)) })),
    syncProject: (id, close) => setDb((d) => applySync(d, id, close)),
    saveKit: (k) => setDb((d) => ({ ...d, kits: d.kits.some((x) => x.id === k.id) ? d.kits.map((x) => (x.id === k.id ? k : x)) : [...d.kits, k] })),
    deleteKit: (id) => setDb((d) => ({ ...d, kits: d.kits.filter((x) => x.id !== id) })),
        replaceAll: (n) => { setDb(n); setNav({ view: 'dash', projectId: null, phase: 1 }); },
  };

  const withTimeout = (p) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'unavailable' }), 15000))]);
  const S = {
    user,
    openAuth: () => setAuthOpen(true),
    upload: () => withTimeout(push(db)),
    download: async () => {
      if (!user || !window.FB) throw { message: 'No hay sesión iniciada.' };
      const snap = await withTimeout(window.FB.get(user.uid));
      if (!snap.exists()) throw { code: 'not-found', message: 'Todavía no hay datos en la nube. Usa «Subir datos» primero.' };
      const n = normalizeDb(snap.data());
      if (!n) throw { message: 'Los datos de la nube no tienen un formato válido.' };
      try { localStorage.setItem(KEY + '.respaldo-previo', JSON.stringify(db)); } catch (e) { /* sin espacio */ }
      skipSave.current = true; A.replaceAll(n);
    },
  };
  const doSignOut = async () => {
    try { await window.FB.signOut(); } catch (e) { /* ya sin sesión */ }
    setAuthOpen(false); showToast('Sesión cerrada. Sigues en Modo Local.');
  };
  const syncStatus = !user ? 'local' : (!online ? 'offline' : sync);

  const project = nav.view === 'proj' ? db.projects.find((p) => p.id === nav.projectId) : null;
  const view = nav.view === 'proj' && !project ? 'proj-list' : nav.view;
  const tabs = [
    { id: 'dash', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'inv', label: 'Inventario', icon: 'Package' },
    { id: 'proj', label: 'Proyectos', icon: 'Clapperboard' },
  ];
  const activeTab = view === 'proj-list' ? 'proj' : view;

  return html`<div className="lg:flex lg:items-start lg:gap-8">
    <aside className="sticky top-4 hidden w-56 shrink-0 flex-col gap-5 lg:flex">
      <div><div className="clap mb-3 h-2 w-16"></div><div className="font-display text-3xl font-bold uppercase leading-none">Inventario<br />de rodaje</div><div className="lbl mt-2">${db.yo || 'LOPsar Gear'}</div></div>
      <nav className="flex flex-col gap-1" aria-label="Principal">${tabs.map((t) => html`<button key=${t.id} onClick=${() => go(t.id)} aria-current=${activeTab === t.id ? 'page' : undefined} className=${cn('flex min-h-[48px] items-center gap-3 rounded-md px-3 text-left font-semibold transition-colors', activeTab === t.id ? 'bg-amber-500 text-slate-950' : 'text-slate-300 hover:bg-slate-800')}><${Icon} name=${t.icon} />${t.label}</button>`)}</nav>
      <div className="flex flex-col gap-2 border-t border-slate-700 pt-4">
        <button onClick=${() => setDataOpen(true)} className=${cn(B_GHOST, 'justify-start')}><${Icon} name="Database" size=${16} />Respaldo de datos</button>
        <div className=${cn('flex items-start gap-2 text-xs', storageOk ? 'text-slate-500' : 'text-red-300')}><span className=${cn('mt-1 h-2 w-2 shrink-0 rounded-full', storageOk ? 'bg-emerald-500' : 'bg-red-500')}></span>${storageOk ? 'Guardado en este navegador' : 'No se puede guardar aquí. Exporta un respaldo.'}</div>
      </div>
    </aside>

    <main className="min-w-0 flex-1 pb-28 lg:pb-10">
      <div className="mb-4 flex items-center justify-between lg:hidden"><div className="flex items-center gap-3"><div className="clap h-8 w-8 rounded-sm"></div><span className="font-display text-2xl font-bold uppercase leading-none">Inventario de rodaje</span></div>${!storageOk && html`<span className="text-xs text-red-300">Sin guardado local</span>`}</div>
      <${CloudBar} status=${syncStatus} user=${user} msg=${syncMsg} onOpen=${() => setAuthOpen(true)} />
      ${view === 'dash' && html`<${Dashboard} db=${db} A=${A} go=${go} openProject=${openProject} openEdit=${setEdit} setFilters=${setFilters} showToast=${showToast} />`}
      ${view === 'inv' && html`<${Inventory} db=${db} filters=${filters} setFilters=${setFilters} A=${A} showToast=${showToast} edit=${edit} setEdit=${setEdit} />`}
      ${(view === 'proj-list' || view === 'proj') && !project && html`<${Projects} db=${db} A=${A} openProject=${openProject} openNew=${openNew} setOpenNew=${setOpenNew} showToast=${showToast} />`}
      ${project && html`<${ProjectDetail} key=${project.id} project=${project} db=${db} A=${A} phase=${nav.phase} setPhase=${(n) => setNav({ ...nav, phase: n })} back=${() => go('proj')} showToast=${showToast} />`}
    </main>

    <nav className="fixed inset-x-0 bottom-0 z-40 grid grid-cols-4 border-t border-slate-700 bg-slate-900 lg:hidden" aria-label="Principal móvil" style=${{ paddingLeft: 'max(8px, env(safe-area-inset-left, 0px))', paddingRight: 'max(8px, env(safe-area-inset-right, 0px))', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
      ${tabs.map((t) => html`<button key=${t.id} onClick=${() => go(t.id)} aria-current=${activeTab === t.id ? 'page' : undefined} className=${cn('flex min-h-[60px] flex-col items-center justify-center gap-1 text-[11px] font-semibold', activeTab === t.id ? 'text-amber-400' : 'text-slate-400')}><${Icon} name=${t.icon} size=${22} />${t.label}</button>`)}
      <button onClick=${() => setDataOpen(true)} className="flex min-h-[60px] flex-col items-center justify-center gap-1 text-[11px] font-semibold text-slate-400"><${Icon} name="Database" size=${22} />Respaldo</button>
    </nav>

    ${edit && html`<${ItemForm} key=${edit === 'new' ? 'new' : edit.id} db=${db} item=${edit === 'new' ? null : edit} onClose=${() => setEdit(null)} A=${A} showToast=${showToast} />`}
    ${dataOpen && html`<${DataModal} db=${db} onClose=${() => setDataOpen(false)} A=${A} showToast=${showToast} S=${S} />`}
    ${authOpen && html`<${AuthModal} user=${user} fbState=${fbState} status=${syncStatus} msg=${syncMsg} onClose=${() => setAuthOpen(false)} onOut=${doSignOut} showToast=${showToast} />`}
    ${toast && html`<div role="status" className="fixed left-1/2 z-[60] max-w-[92vw] -translate-x-1/2 rounded-md border border-emerald-500/50 bg-slate-800 px-4 py-3 text-sm font-medium text-emerald-300 shadow-xl bottom-24 lg:bottom-6">${toast}</div>`}
  </div>`;
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  render() {
    if (this.state.err) return React.createElement('pre', { style: { margin: 16, padding: 16, border: '1px solid #ef4444', borderRadius: 6, color: '#fecaca', font: '13px monospace', whiteSpace: 'pre-wrap' } }, 'Error en la app: ' + String((this.state.err && (this.state.err.stack || this.state.err.message)) || this.state.err));
    return this.props.children;
  }
}
try {
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Boundary, null, React.createElement(App)));
} catch (e) { fatal('Error al montar: ' + (e && (e.stack || e.message) || e)); }
})();
</script>
