<script>
(function () {
function fatal(msg) {
  var r = document.getElementById('root');
  if (r && !r.firstChild) r.innerHTML = '<div style="margin:16px;padding:16px;border:1px solid #ef4444;border-radius:6px;color:#fecaca;font:13px monospace;white-space:pre-wrap">' + String(msg).replace(/</g, '&lt;') + '</div>';
}
window.addEventListener('error', function (e) { fatal('Error al iniciar: ' + (e.message || e)); });
if (!window.React || !window.ReactDOM) { fatal('No cargó React desde la CDN.'); return; }
if (!window.htm) { fatal('No cargó la librería htm desde la CDN.'); return; }
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- Utilidades ---------- */
const KEY = 'inventario-rodaje.tai.v1';
const uid = () => Math.random().toString(36).slice(2, 8);
const cn = (...a) => a.filter(Boolean).join(' ');
const numCmp = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true });
const uniq = (arr) => Array.from(new Set(arr.filter(Boolean)));
const hoy = () => new Date().toLocaleDateString('es-CR');
const cleanMant = (s) => (s || '').split('\n').map((l) => l.replace(/^\[#\w+\]\s*/, '')).join('\n');

const ALIAS = { AlertTriangle: 'TriangleAlert', TriangleAlert: 'AlertTriangle', Home: 'House', House: 'Home', Table2: 'Table', Table: 'Table2', CheckCircle2: 'CircleCheck', CircleCheck: 'CheckCircle2', AlertCircle: 'CircleAlert', CircleAlert: 'AlertCircle' };
function Icon({ name, size = 18, className = '', strokeWidth = 2 }) {
  const set = (window.lucide && window.lucide.icons) || {};
  const node = set[name] || set[ALIAS[name]];
  let kids = node;
  if (Array.isArray(node) && node[0] === 'svg' && Array.isArray(node[2])) kids = node[2];
  const valid = Array.isArray(kids) && kids.every((k) => Array.isArray(k) && typeof k[0] === 'string' && k[1] && typeof k[1] === 'object');
  if (!valid) return html`<span style=${{ display: 'inline-block', width: size, height: size }}></span>`;
  return React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round', className, 'aria-hidden': true },
    kids.map((k, i) => React.createElement(k[0], { ...k[1], key: i })));
}

/* ---------- Estados ---------- */
const E_HOME = 'Disponible en casa', E_WAY = 'En camino', E_PARTNER = 'En posesión de socio', E_LOAN = 'Prestado / Uso compartido', E_REV = 'Requiere revisión', E_SOLD = 'Vendido / Baja';
const ESTADOS = [E_HOME, E_WAY, E_PARTNER, E_LOAN, E_REV, E_SOLD];
const ESTADO_UI = {
  [E_HOME]: { chip: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40', dot: 'bg-emerald-400', sel: 'border-emerald-500/60 text-emerald-200' },
  [E_WAY]: { chip: 'bg-blue-500/15 text-blue-300 border-blue-500/40', dot: 'bg-blue-400', sel: 'border-blue-500/60 text-blue-200' },
  [E_PARTNER]: { chip: 'bg-amber-500/15 text-amber-300 border-amber-500/40', dot: 'bg-amber-400', sel: 'border-amber-500/60 text-amber-200' },
  [E_LOAN]: { chip: 'bg-purple-500/15 text-purple-300 border-purple-500/40', dot: 'bg-purple-400', sel: 'border-purple-500/60 text-purple-200' },
  [E_REV]: { chip: 'bg-red-500/15 text-red-300 border-red-500/40', dot: 'bg-red-400', sel: 'border-red-500/60 text-red-200' },
  [E_SOLD]: { chip: 'bg-slate-500/20 text-slate-400 border-slate-500/40', dot: 'bg-slate-500', sel: 'border-slate-500/60 text-slate-400' },
};
const ui = (e) => ESTADO_UI[e] || ESTADO_UI[E_HOME];

/* ---------- Categorías de ejemplo (la lista real es editable y vive en db.categorias) ---------- */
const C1 = '1. Cámara y Rigging', C2 = '2. Óptica y Filtros', C3 = '3. Almacenamiento', C4 = '4. Monitoreo', C5 = '5. Alimentación y Baterías', C6 = '6. Estabilización y Soporte', C7 = '7. Iluminación y Modificadores', C8 = '8. Dispositivos y Postproducción';
const CATEGORIAS_BASE = [C1, C2, C3, C4, C5, C6, C7, C8];
const KIT_ICONS = ['Package', 'Camera', 'Zap', 'Film', 'Aperture', 'Mic', 'Lightbulb', 'Monitor', 'Battery', 'HardDrive', 'Briefcase', 'Star'];
// Respaldos antiguos sin "kits" reciben los kits de fábrica; nunca se tocan inventario ni proyectos.
function normalizeKits(raw) {
  if (!Array.isArray(raw)) return [];
  const seen = new Set();
  return raw.filter((k) => k && typeof k === 'object').map((k) => {
    let id = String(k.id || '') || 'KIT-' + uid();
    while (seen.has(id)) id = 'KIT-' + uid();
    seen.add(id);
    return { id, nombre: String(k.nombre || 'Kit sin nombre'), icon: typeof k.icon === 'string' && k.icon ? k.icon : 'Package', ids: uniq(Array.isArray(k.ids) ? k.ids.map(String) : []) };
  });
}
// Versión en blanco: sin equipos, proyectos, préstamos ni kits. Solo trae categorías de ejemplo (editables).
const freshDb = () => normalizeDb({ inventory: [], projects: [], loans: [], personas: [], casas: [], kits: [], categorias: CATEGORIAS_BASE.slice(), yo: '' });

function normalizeDb(d) {
  if (!d || !Array.isArray(d.inventory) || !Array.isArray(d.projects)) return null;
  // Migración: el estado antiguo "En camino (SmartBox CR)" ahora es solo "En camino" (en inventario y proyectos).
  try { if (JSON.stringify(d).includes('En camino (SmartBox CR)')) d = JSON.parse(JSON.stringify(d).split('En camino (SmartBox CR)').join('En camino')); } catch (e) { /* se usa tal cual */ }
  const inventory = d.inventory.map((i) => {
    const it = { mant: '', specs: '', notas: '', cantidad: 1, foto: '', ...i };
    if (!it.tipoProp || !Array.isArray(it.duenos) || !it.duenos.length) Object.assign(it, parsePropiedad(it.propiedad));
    it.propiedad = propString(it.tipoProp, it.duenos);
    return it;
  });
  const loans = Array.isArray(d.loans) ? d.loans : [];
  const projects = d.projects.map((p) => ({ seleccion: {}, prep: {}, wrap: {}, estado: 'Activo', flagged: {}, renta: [], ...p }));
  // Datos antiguos (sin campo "yo") eran de Tai: se conserva ese nombre para que nada cambie.
  const yo = typeof d.yo === 'string' ? d.yo.replace(/\s+/g, ' ').trim() : 'Tai';
  const personas = uniqNames([...(Array.isArray(d.personas) ? d.personas : []), yo, ...inventory.flatMap((i) => i.duenos.map((x) => x.nombre)), ...loans.map((l) => l.dueno)]);
  const casas = uniqNames([...(Array.isArray(d.casas) ? d.casas : []), ...projects.flatMap((p) => (p.renta || []).map((r) => r.casa))]);
  const kits = normalizeKits(d.kits);
  // Categorías: si el dato es antiguo (sin lista) se usan las 8 de siempre; además nunca se pierde una categoría que algún equipo use.
  const base = Array.isArray(d.categorias) ? d.categorias : CATEGORIAS_BASE;
  const categorias = uniqNames([...base.map((c) => String(c || '')), ...(Array.isArray(d.categorias) ? [] : inventory.map((i) => i.categoria))]);
  return { inventory, projects, loans, personas, casas, kits, categorias, yo };
}
function loadDb() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const n = normalizeDb(JSON.parse(raw)); if (n) return n; }
  } catch (e) { /* sin almacenamiento: se usan los datos de fábrica */ }
  return freshDb();
}

/* ---------- Nube (Firebase): utilidades ---------- */
/* Hub: pon aquí la dirección de tu página principal. required:true obliga a iniciar sesión en el hub. */
const HUB = { url: 'https://lopsar.github.io/LOPsarHub/', required: false, name: 'Hub' };
const DEVICE_KEY = KEY + '.device';
const DEVICE = (() => { try { let d = localStorage.getItem(DEVICE_KEY); if (!d) { d = 'dev-' + uid() + uid(); localStorage.setItem(DEVICE_KEY, d); } return d; } catch (e) { return 'dev-' + uid() + uid(); } })();
const coreDb = (d) => ({ inventory: d.inventory, projects: d.projects, loans: d.loans, personas: d.personas, casas: d.casas, kits: d.kits, categorias: d.categorias, yo: d.yo });
// Firestore devuelve los mapas con otro orden de claves; se compara con claves ordenadas.
const stable = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, kk) => { o[kk] = x[kk]; return o; }, {}) : x));
function authMsg(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/invalid-email') return 'El correo no es válido.';
  if (c === 'auth/missing-password' || c === 'auth/weak-password') return 'La contraseña debe tener al menos 6 caracteres.';
  if (c === 'auth/email-already-in-use') return 'Ese correo ya tiene cuenta. Usa «Iniciar Sesión».';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(c)) return 'Correo o contraseña incorrectos.';
  if (c === 'auth/too-many-requests') return 'Demasiados intentos. Espera unos minutos e inténtalo otra vez.';
  if (c === 'auth/network-request-failed') return 'Sin conexión. Revisa tu internet.';
  if (c === 'auth/unauthorized-domain') return 'Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/popup-blocked') return 'El navegador bloqueó la ventana de Google. Permite las ventanas emergentes e inténtalo otra vez.';
  if (c === 'auth/account-exists-with-different-credential') return 'Ese correo ya existe con otro método de acceso. Entra con tu correo y contraseña.';
  if (c === 'auth/operation-not-allowed') return 'El acceso con correo y contraseña no está activado en Firebase (Authentication → Método de acceso).';
  return 'No se pudo completar' + (c ? ' (' + c + ')' : '') + '.';
}
function cloudMsg(e) {
  const c = (e && e.code) || '';
  if (c === 'permission-denied' || c === 'firestore/permission-denied') return 'Firestore rechazó el acceso. Revisa las reglas de seguridad de la base de datos.';
  if (c === 'unavailable' || c === 'firestore/unavailable') return 'Sin conexión con la nube. Tus cambios siguen guardados en este dispositivo.';
  if (c === 'too-big' || c === 'resource-exhausted' || c === 'invalid-argument') return 'Los datos superan el límite de 1 MB de Firestore. Quita algunas fotos de equipos e inténtalo de nuevo.';
  if (c === 'not-found') return (e && e.message) || 'Todavía no hay datos en la nube.';
  return (e && e.message) || c || 'Error desconocido.';
}

/* ---------- Lógica de dominio ---------- */
const esCopropiedad = (it) => /copropiedad/i.test(it.propiedad || '');
const esPrestamoRecibido = (it) => /^pr[eé]stamo/i.test(it.propiedad || '');
let ME = 'Tai'; // nombre del dueño de la cuenta (db.yo); se actualiza en App
const socioDe = (it) => { const o = (it.duenos || []).find((x) => normName(x.nombre) !== normName(ME)); return o ? o.nombre : 'Socio'; };
const primerNombre = (s) => String(s).split(' ')[0];
const loanAsItem = (l) => ({ id: l.id, categoria: '9. Préstamos de terceros', nombre: l.nombre, marca: 'Prestada por ' + l.dueno, modelo: '', cantidad: 1, specs: '', estado: E_LOAN, propiedad: 'Préstamo (' + l.dueno + ')', notas: l.notas || '', mant: '', _loan: true });
const nextId = (inv) => 'EQ-' + String(inv.reduce((m, i) => Math.max(m, parseInt(String(i.id).replace(/\D/g, ''), 10) || 0), 0) + 1).padStart(3, '0');

function projectEntries(p, db) {
  const out = [];
  Object.keys(p.seleccion || {}).forEach((k) => {
    const it = db.inventory.find((i) => i.id === k);
    if (it) out.push({ key: k, item: it, qty: p.seleccion[k] });
    else { const l = db.loans.find((x) => x.id === k); if (l) out.push({ key: k, item: loanAsItem(l), qty: p.seleccion[k] }); }
  });
  (p.renta || []).forEach((r) => out.push({ key: r.id, qty: r.cantidad, item: { id: r.id, categoria: 'Renta · ' + r.casa, nombre: r.nombre, marca: r.marca, modelo: r.modelo, cantidad: r.cantidad, specs: '', estado: 'Renta', propiedad: 'Renta (' + r.casa + ')', notas: r.notas || '', mant: '', _renta: true, casa: r.casa } }));
  out.sort((a, b) => numCmp(a.item.categoria, b.item.categoria) || numCmp(a.item.id, b.item.id));
  return out;
}
function groupBy(list, fn) {
  const m = new Map();
  list.forEach((x) => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return Array.from(m.entries()).sort((a, b) => numCmp(a[0], b[0]));
}
function progress(p, db) {
  const e = projectEntries(p, db);
  return {
    total: e.length,
    units: e.reduce((s, x) => s + x.qty, 0),
    prep: e.filter((x) => p.prep && p.prep[x.key] && p.prep[x.key].done).length,
    wrap: e.filter((x) => p.wrap && p.wrap[x.key] && p.wrap[x.key].status).length,
    dano: e.filter((x) => p.wrap && p.wrap[x.key] && p.wrap[x.key].status === 'dano').length,
    falt: e.filter((x) => p.wrap && p.wrap[x.key] && p.wrap[x.key].status === 'faltante').length,
  };
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function aviso(it) {
  if (it.estado === E_WAY) return { tone: 'blue', text: '¡Ojo! Todavía en camino. Confirma que llegue antes del rodaje.' };
  if (it.estado === E_PARTNER) {
    const n = esCopropiedad(it) ? primerNombre(socioDe(it)) : 'tu socio';
    return { tone: 'amber', text: '¡Ojo! Coordinar con ' + n + ' para pedirle ' + it.nombre + ' (' + it.marca + ').' };
  }
  if (it.estado === E_LOAN) return { tone: 'purple', text: 'Es un préstamo. Confirma con el dueño que la tienes para esa fecha.' };
  if (it.estado === E_REV) return { tone: 'red', text: 'Pendiente de revisión' + (it.mant ? ': ' + cleanMant(it.mant).split('\n')[0] : '.') };
  return null;
}
const AV_TONE = { blue: 'text-blue-300 bg-blue-500/10 border-blue-500/30', amber: 'text-amber-300 bg-amber-500/10 border-amber-500/30', purple: 'text-purple-300 bg-purple-500/10 border-purple-500/30', red: 'text-red-300 bg-red-500/10 border-red-500/30' };

function applySync(db, pid, close) {
  const p = db.projects.find((x) => x.id === pid);
  if (!p) return db;
  const tag = '[#' + p.id + ']';
  const fecha = hoy();
  const flagged = { ...(p.flagged || {}) };
  const inventory = db.inventory.map((it) => {
    if (!(it.id in p.seleccion)) return it;
    const w = (p.wrap || {})[it.id] || {};
    const lines = (it.mant || '').split('\n').filter((l) => l.trim() && !l.startsWith(tag));
    let estado = it.estado;
    if (w.status === 'dano' || w.status === 'faltante') {
      lines.push(tag + ' ' + fecha + ' · ' + p.nombre + ' · ' + (w.status === 'dano' ? 'DAÑO' : 'FALTANTE') + ': ' + (w.nota || 'sin detalle'));
      estado = E_REV; flagged[it.id] = true;
    } else if (flagged[it.id]) {
      if (lines.length === 0 && estado === E_REV) estado = E_HOME;
      delete flagged[it.id];
    }
    return { ...it, mant: lines.join('\n'), estado };
  });
  const projects = db.projects.map((x) => (x.id === pid ? { ...x, flagged, syncedAt: Date.now(), estado: close ? 'Finalizado' : x.estado } : x));
  return { ...db, inventory, projects };
}

function exportText(p, db) {
  const e = projectEntries(p, db);
  const lines = ['LISTA DE EQUIPO · ' + p.nombre];
  if (p.fechas) lines.push('Fecha(s): ' + p.fechas);
  if (p.locacion) lines.push('Locación: ' + p.locacion);
  if (p.tipo) lines.push('Tipo: ' + p.tipo);
  lines.push('');
  groupBy(e, (x) => x.item.categoria).forEach(([cat, arr]) => {
    lines.push(cat.toUpperCase());
    arr.forEach((x) => {
      const det = [x.item.marca, x.item.modelo].filter(Boolean).join(' ');
      lines.push('  [ ] ' + x.qty + 'x ' + x.item.nombre + (det ? ' — ' + det : ''));
    });
    lines.push('');
  });
  lines.push('Total: ' + e.length + ' equipos, ' + e.reduce((s, x) => s + x.qty, 0) + ' unidades');
  return lines.join('\n');
}

async function copyText(text, ta) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { if (ta && ta.current) { ta.current.focus(); ta.current.select(); } return false; }
}

/* ---------- Estilos compartidos ---------- */
const BTN = 'inline-flex items-center justify-center gap-2 min-h-[44px] px-4 rounded-md font-semibold text-sm transition-colors';
const B_PRIMARY = BTN + ' bg-amber-500 text-slate-950 hover:bg-amber-400';
const B_GHOST = BTN + ' border border-slate-600 text-slate-200 hover:bg-slate-700/60';
const B_DANGER = BTN + ' border border-red-500/40 bg-red-500/15 text-red-300 hover:bg-red-500/25';
const B_OK = BTN + ' bg-emerald-500 text-slate-950 hover:bg-emerald-400';
const INPUT = 'w-full min-h-[44px] rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-slate-100 placeholder-slate-500 focus:border-amber-500 focus:outline-none';
const CARD = 'rounded-md border border-slate-700 bg-slate-800';

/* ---------- Componentes base ---------- */
function Chip({ estado, small }) {
  const u = ui(estado);
  return html`<span className=${cn('inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 font-medium whitespace-nowrap', small ? 'text-[11px]' : 'text-xs', u.chip)}><span className=${cn('h-1.5 w-1.5 rounded-full', u.dot)}></span>${estado}</span>`;
}
function EstadoSelect({ value, onChange, label }) {
  const u = ui(value);
  return html`<select aria-label=${label || 'Estado actual'} value=${value} onChange=${(e) => onChange(e.target.value)} className=${cn('min-h-[44px] w-full rounded-md border bg-slate-900 px-2 text-sm font-medium', u.sel)}>${ESTADOS.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}</select>`;
}
function Field({ id, label, children, hint }) {
  return html`<div className="flex flex-col gap-1.5"><label htmlFor=${id} className="lbl">${label}</label>${children}${hint && html`<span className="text-xs text-slate-500">${hint}</span>`}</div>`;
}
function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return html`
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 sm:items-center sm:p-4" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-label=${title} className=${cn('max-h-[92vh] w-full overflow-y-auto rounded-t-lg border border-slate-600 bg-slate-800 shadow-2xl sm:rounded-md', wide ? 'max-w-3xl' : 'max-w-2xl')} style=${{ paddingBottom: 'env(safe-area-inset-bottom,0px)' }}>
        <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-slate-700 bg-slate-800 px-4 py-3 sm:px-5">
          <h2 className="font-display text-2xl font-semibold uppercase tracking-wide text-amber-400">${title}</h2>
          <button onClick=${onClose} aria-label="Cerrar" className="flex h-11 w-11 items-center justify-center rounded-md text-slate-300 hover:bg-slate-700"><${Icon} name="X" /></button>

/* ---------- Propiedad, nombres registrados, fotos ---------- */
const normName = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
function uniqNames(arr) {
  const seen = new Set(); const out = [];
  arr.forEach((n) => { const t = String(n || '').replace(/\s+/g, ' ').trim(); const k = normName(t); if (t && !seen.has(k)) { seen.add(k); out.push(t); } });
  return out;
}
const propString = (tipo, duenos) => {
  const d = duenos || [];
  if (tipo === 'copro') return 'Copropiedad (' + d.map((x) => x.pct + '% ' + x.nombre).join(' / ') + ')';
  if (tipo === 'prestamo') return 'Préstamo (' + (d[0] ? d[0].nombre : '') + ')';
  return 'Propio (100% ' + (d[0] ? d[0].nombre : '') + ')';
};
function parsePropiedad(str) {
  const s = String(str || '');
  if (/^copropiedad/i.test(s)) {
    const inner = (s.match(/\((.*)\)/) || [])[1] || '';
    const d = inner.split('/').map((p) => { const m = p.trim().match(/^(\d+(?:\.\d+)?)%\s*(.+)$/); return m ? { nombre: m[2].trim(), pct: Number(m[1]) } : null; }).filter(Boolean);
    if (d.length >= 2) return { tipoProp: 'copro', duenos: d };
  }
  if (/^pr[eé]stamo/i.test(s)) {
    const n = ((s.match(/\((.*)\)/) || [])[1] || 'Otro').trim();
    return { tipoProp: 'prestamo', duenos: [{ nombre: n, pct: 100 }] };
  }
  const m = s.match(/\(100%\s*(.+)\)/);
  return { tipoProp: 'propio', duenos: [{ nombre: m ? m[1].trim() : '', pct: 100 }] };
}

function compressImage(file, max) {
  const side = max || 360;
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('lectura'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('imagen'));
      img.onload = () => {
        const s = Math.min(1, side / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        const x = c.getContext('2d');
        x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = String(r.result);
    };
    r.readAsDataURL(file);
  });
}

/* Lista desplegable de nombres ya registrados. Para agregar uno nuevo se usa la opción "Agregar nueva" y se evitan duplicados. */
function NamePicker({ id, value, options, onChange, onAdd, exclude, placeholder }) {
  const [adding, setAdding] = useState(false);
  const [txt, setTxt] = useState('');
  const [msg, setMsg] = useState('');
  const ex = (exclude || []).map(normName);
  const list = options.filter((o) => normName(o) === normName(value) || !ex.includes(normName(o)));
  const close = () => { setAdding(false); setTxt(''); };
  const add = () => {
    const n = txt.replace(/\s+/g, ' ').trim();
    if (!n) { setMsg('Escribe un nombre.'); return; }
    const found = options.find((o) => normName(o) === normName(n));
    if (found) {
      if (ex.includes(normName(found))) { setMsg('«' + found + '» ya está elegido en esta lista.'); return; }
      onChange(found); setMsg('«' + found + '» ya estaba registrado. Se eligió el existente.'); close(); return;
    }
    onAdd(n); onChange(n); setMsg(''); close();
  };
  return html`<div className="flex min-w-0 flex-col gap-2">
    <select id=${id} aria-label=${placeholder || 'Elegir'} className=${INPUT} value=${adding ? '__new__' : (value || '')} onChange=${(e) => { const v = e.target.value; if (v === '__new__') { setAdding(true); setMsg(''); } else { setAdding(false); setMsg(''); onChange(v); } }}>
      <option value="" disabled>${placeholder || 'Elige una opción'}</option>
      ${list.map((o) => html`<option key=${o} value=${o}>${o}</option>`)}
      <option value="__new__">+ Agregar nueva…</option>
    </select>
    ${adding && html`<div className="flex flex-wrap gap-2">
      <input id=${id + '-nuevo'} aria-label="Nombre nuevo" autoFocus className=${cn(INPUT, 'min-w-[160px] flex-1')} value=${txt} placeholder="Nombre nuevo" onChange=${(e) => { setTxt(e.target.value); setMsg(''); }} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } }} />
      <button type="button" onClick=${add} className=${B_PRIMARY}>Agregar</button>
      <button type="button" onClick=${close} className=${B_GHOST}>Cancelar</button>
    </div>`}
    ${msg && html`<p className="text-xs text-amber-300">${msg}</p>`}
  </div>`;
}

    : { id: nextId(db.inventory), categoria: '', nombre: '', marca: '', modelo: '', cantidad: '1', specs: '', estado: E_HOME, tipoProp: 'propio', duenos: [{ nombre: db.yo || '', pct: 100 }], notas: '', mant: '', foto: '' });
  const [err, setErr] = useState('');
  const [busyFoto, setBusyFoto] = useState(false);
  const cats = item && item.categoria && !db.categorias.includes(item.categoria) ? [...db.categorias, item.categoria] : db.categorias;
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const setTipo = (t) => {
    const first = (f.duenos[0] && f.duenos[0].nombre) || '';
    if (t === 'copro') setF({ ...f, tipoProp: t, duenos: [{ nombre: first || db.yo || '', pct: 50 }, { nombre: '', pct: 50 }] });
    else if (t === 'prestamo') setF({ ...f, tipoProp: t, duenos: [{ nombre: normName(first) === normName(db.yo) ? '' : first, pct: 100 }] });
    else setF({ ...f, tipoProp: t, duenos: [{ nombre: first || db.yo || '', pct: 100 }] });
  };
  const setDueno = (i, patch) => setF((c) => ({ ...c, duenos: c.duenos.map((d, j) => (j === i ? { ...d, ...patch } : d)) }));
  const addDueno = () => setF((c) => ({ ...c, duenos: [...c.duenos, { nombre: '', pct: 0 }] }));
  const delDueno = (i) => setF((c) => ({ ...c, duenos: c.duenos.filter((_, j) => j !== i) }));
  const equalSplit = () => setF((c) => { const n = c.duenos.length; const base = Math.floor(100 / n); return { ...c, duenos: c.duenos.map((d, j) => ({ ...d, pct: j === n - 1 ? 100 - base * (n - 1) : base })) }; });
  const total = f.duenos.reduce((s, d) => s + (Number(d.pct) || 0), 0);
  const totalOk = Math.abs(total - 100) < 0.01;

  const onFoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setBusyFoto(true); setErr('');
    try { const url = await compressImage(file); setF((c) => ({ ...c, foto: url })); }
    catch (x) { setErr('No se pudo leer la imagen. Prueba con otra foto (JPG o PNG).'); }
    setBusyFoto(false);

  const submit = (e) => {
    e.preventDefault();
    const cant = parseInt(f.cantidad, 10);
    if (!f.nombre.trim()) return setErr('Escribe el nombre del equipo.');
    if (!f.categoria || !cats.includes(f.categoria)) return setErr('Elige una categoría de la lista.');
    if (!cant || cant < 1) return setErr('La cantidad debe ser 1 o más.');
    let duenos = f.duenos.map((d) => ({ nombre: String(d.nombre || '').trim(), pct: Number(d.pct) || 0 }));
    if (f.tipoProp === 'copro') {
      if (duenos.length < 2) return setErr('La copropiedad necesita al menos 2 personas.');
      if (duenos.some((d) => !d.nombre)) return setErr('Elige la persona de cada fila de copropiedad.');
      if (new Set(duenos.map((d) => normName(d.nombre))).size !== duenos.length) return setErr('Hay una persona repetida en la copropiedad.');
      if (duenos.some((d) => d.pct <= 0)) return setErr('Cada porcentaje debe ser mayor que 0.');
      if (!totalOk) return setErr('Los porcentajes deben sumar 100%. Ahora suman ' + total + '%.');
    } else {
      if (!duenos[0] || !duenos[0].nombre) return setErr(f.tipoProp === 'prestamo' ? 'Elige quién presta el equipo.' : 'Elige el dueño del equipo.');
      duenos = [{ nombre: duenos[0].nombre, pct: 100 }];
    }
    const clean = { ...f, nombre: f.nombre.trim(), cantidad: cant, duenos, propiedad: propString(f.tipoProp, duenos) };
    if (isNew) { A.addItem(clean); showToast('Equipo agregado: ' + clean.id); }
    else { A.updateItem(item.id, clean); showToast('Cambios guardados en ' + clean.id); }
    onClose();
  };

  const tipos = [['propio', 'Propio'], ['copro', 'Copropiedad'], ['prestamo', 'Préstamo']];
  return html`<${Modal} title=${isNew ? 'Agregar equipo' : 'Editar ' + item.id} onClose=${onClose}>
    <form onSubmit=${submit} className="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div className="flex items-center gap-4 sm:col-span-2">
        <${Thumb} item=${f} size=${84} />

          <div className="flex flex-wrap gap-2">
            <label htmlFor="f-foto" className=${cn(B_GHOST, 'cursor-pointer')}><${Icon} name="Camera" size=${16} />${busyFoto ? 'Procesando…' : (f.foto ? 'Cambiar foto' : 'Subir foto')}</label>
            <input id="f-foto" type="file" accept="image/*" onChange=${onFoto} className="sr-only" />
            ${f.foto && html`<button type="button" onClick=${() => setF({ ...f, foto: '' })} className=${B_GHOST}>Quitar</button>`}
          </div>
          <span className="text-xs text-slate-500">Se reduce sola para ocupar poco espacio.</span>
        </div>
      </div>
      <${Field} id="f-id" label="ID (automático)"><input id="f-id" className=${cn(INPUT, 'font-mono text-slate-400')} value=${f.id} readOnly /><//>
      <${Field} id="f-cat" label="Categoría"><select id="f-cat" className=${INPUT} value=${f.categoria} onChange=${set('categoria')}><option value="" disabled>Elige una categoría</option>${cats.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select><//>
      <div className="sm:col-span-2"><${Field} id="f-nombre" label="Nombre del equipo"><input id="f-nombre" autoFocus=${isNew} className=${INPUT} value=${f.nombre} onChange=${set('nombre')} /><//></div>
      <${Field} id="f-marca" label="Marca"><input id="f-marca" className=${INPUT} value=${f.marca} onChange=${set('marca')} /><//>
      <${Field} id="f-modelo" label="Modelo exacto"><input id="f-modelo" className=${INPUT} value=${f.modelo} onChange=${set('modelo')} /><//>
      <${Field} id="f-cant" label="Cantidad"><input id="f-cant" type="number" min="1" inputMode="numeric" className=${INPUT} value=${f.cantidad} onChange=${set('cantidad')} /><//>

        <div className="grid grid-cols-3 gap-2" role="group" aria-label="Tipo de propiedad">
          ${tipos.map(([k, l]) => html`<button key=${k} type="button" onClick=${() => setTipo(k)} aria-pressed=${f.tipoProp === k} className=${cn('min-h-[48px] rounded-md border-2 px-2 text-sm font-semibold', f.tipoProp === k ? 'border-amber-500 bg-amber-500 text-slate-950' : 'border-slate-600 text-slate-300 hover:bg-slate-700/60')}>${l}</button>`)}
        </div>
        ${f.tipoProp === 'propio' && html`<div className="grid grid-cols-[1fr_88px] items-start gap-2">
          <${NamePicker} id="f-dueno-0" value=${f.duenos[0].nombre} options=${db.personas} onChange=${(v) => setDueno(0, { nombre: v })} onAdd=${A.addPersona} placeholder="Dueño del equipo" />
          <div className="flex min-h-[44px] items-center justify-center rounded-md border border-slate-700 font-mono text-sm text-slate-300">100%</div>
        </div>`}
        ${f.tipoProp === 'prestamo' && html`<${NamePicker} id="f-dueno-0" value=${f.duenos[0].nombre} options=${db.personas} onChange=${(v) => setDueno(0, { nombre: v })} onAdd=${A.addPersona} placeholder="Prestado por" />`}
        ${f.tipoProp === 'copro' && html`<div className="flex flex-col gap-3">
          ${f.duenos.map((d, i) => html`<div key=${i} className="grid grid-cols-[1fr_88px_44px] items-start gap-2">

      <div className="flex flex-wrap items-start justify-between gap-3">

        <div className="lbl mb-2 flex items-center gap-2 !text-sky-300"><${Icon} name="Truck" size=${14} />${casa}</div>

          <div className="flex items-center">

          </div>
        </li>`)}</ul></div>`)}

    ${form && html`<${RentalForm} db=${db} A=${A} rental=${form === 'new' ? null : form} onClose=${() => setForm(null)} onSave=${save} />`}

}

/* ---------- DASHBOARD ---------- */
function Dashboard({ db, A, go, openProject, openEdit, setFilters, showToast }) {
  const inv = db.inventory;
  const vivos = inv.filter((i) => i.estado !== E_SOLD);
  const count = (e) => inv.filter((i) => i.estado === e).length;
  const compartidos = inv.filter((i) => i.estado === E_PARTNER || i.estado === E_LOAN).length;
  const alertas = vivos.filter((i) => i.estado === E_REV || (i.mant && i.mant.trim()));
  const copro = vivos.filter(esCopropiedad);
  const recibidos = vivos.filter(esPrestamoRecibido);
  const activos = db.projects.filter((p) => p.estado === 'Activo');
  const next = activos[0];
  const pr = next ? progress(next, db) : null;
  const [loanForm, setLoanForm] = useState(false);
  const [ln, setLn] = useState({ nombre: '', dueno: '' });

  const kpis = [
    { label: 'Equipos registrados', n: vivos.length, sub: inv.length - vivos.length ? (inv.length - vivos.length) + ' dados de baja' : 'en inventario', dot: 'bg-slate-300', filter: '', span: true },
    { label: 'Disponibles en casa', n: count(E_HOME), sub: 'listos para salir', dot: 'bg-emerald-400', filter: E_HOME },
    { label: 'En camino', n: count(E_WAY), sub: 'Por llegar', dot: 'bg-blue-400', filter: E_WAY },
    { label: 'Con socio o compartidos', n: compartidos, sub: 'por coordinar', dot: 'bg-amber-400', filter: E_PARTNER },
    { label: 'Requieren revisión', n: count(E_REV), sub: 'antes del próximo rodaje', dot: 'bg-red-400', filter: E_REV },
  ];
  const openFiltered = (e) => { setFilters({ q: '', cat: '', estado: e, prop: '' }); go('inv'); };
  const submitLoan = (e) => {
    e.preventDefault();
    if (!ln.nombre.trim()) return;
    if (!ln.dueno) { showToast('Elige de quién es el equipo'); return; }
    A.addLoan({ id: 'PR-' + uid(), nombre: ln.nombre.trim(), dueno: (ln.dueno || 'Otro').trim(), notas: '' });
    setLn({ nombre: '', dueno: '' }); setLoanForm(false); showToast('Préstamo registrado');
  };

  return html`<div>
    <${PageTitle} eyebrow=${new Date().toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long' })} title="Centro de mando" />
    <div className="grid grid-cols-2 gap-3 md:grid-cols-5">
      ${kpis.map((k) => html`<button key=${k.label} onClick=${() => openFiltered(k.filter)} className=${cn(CARD, 'flex min-h-[104px] flex-col items-start gap-1 p-4 text-left transition-colors hover:border-amber-500/60', k.span && 'col-span-2 md:col-span-1')}>
        <span className="lbl flex items-center gap-2"><span className=${cn('h-2 w-2 rounded-full', k.dot)}></span>${k.label}</span>
        <span className="num font-display text-5xl font-bold leading-none">${k.n}</span>
        <span className="text-xs text-slate-400">${k.sub}</span>
      </button>`)}
    </div>

    <section className=${cn(CARD, 'mt-5 overflow-hidden')} aria-label="Próximo rodaje">
      <div className="clap h-2"></div>
      <div className="p-4 sm:p-5">
        <div className="lbl mb-2">Próximo rodaje</div>
        ${next ? html`
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div className="min-w-0"><h2 className="font-display text-3xl font-bold uppercase leading-tight sm:text-4xl">${next.nombre}</h2>
              <p className="mt-1 text-sm text-slate-400">${[next.fechas, next.locacion, next.tipo].filter(Boolean).join(' · ') || 'Sin fecha ni locación todavía'}</p></div>
            <div className="flex flex-wrap gap-2">
              <button className=${B_GHOST} onClick=${() => openProject(next.id, 1)}><${Icon} name="ListChecks" />Selección</button>
              <button className=${B_PRIMARY} onClick=${() => openProject(next.id, 2)}><${Icon} name="PackageCheck" />PREP</button>
              <button className=${B_OK} onClick=${() => openProject(next.id, 3)}><${Icon} name="ClipboardCheck" />WRAP</button>
            </div>
          </div>
          <div className="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div><div className="mb-1.5 flex justify-between text-sm"><span className="lbl">PREP · empacado</span><span className="num font-semibold">${pr.prep}/${pr.total} · ${pct(pr.prep, pr.total)}%</span></div><${Bar} value=${pr.prep} total=${pr.total} /></div>
            <div><div className="mb-1.5 flex justify-between text-sm"><span className="lbl">WRAP · verificado</span><span className="num font-semibold">${pr.wrap}/${pr.total} · ${pct(pr.wrap, pr.total)}%</span></div><${Bar} value=${pr.wrap} total=${pr.total} tone="emerald" /></div>
          </div>
          ${activos.length > 1 && html`<button onClick=${() => go('proj')} className="mt-3 text-sm text-amber-400 underline-offset-2 hover:underline">Hay ${activos.length - 1} rodaje(s) activo(s) más</button>`}
        ` : html`<div className="flex flex-wrap items-center justify-between gap-3"><p className="max-w-lg text-slate-400">Todavía no hay un rodaje activo. Crea uno para elegir el equipo, empacar y cerrar el set.</p><button className=${B_PRIMARY} onClick=${() => go('proj', { newProject: true })}><${Icon} name="Plus" />Crear proyecto</button></div>`}
      </div>
    </section>

    <div className="mt-5 grid grid-cols-1 gap-5 xl:grid-cols-2">
      <section className=${cn(CARD, 'min-w-0 p-4 sm:p-5')} aria-label="Alertas de mantenimiento">
        <div className="mb-3 flex items-center justify-between gap-2"><h2 className="font-display text-2xl font-semibold uppercase">Mantenimiento y pendientes</h2><span className="num rounded-full bg-red-500/15 px-2.5 py-0.5 text-sm font-semibold text-red-300">${alertas.length}</span></div>
        ${alertas.length === 0 ? html`<p className="rounded-md border border-emerald-500/30 bg-emerald-500/10 px-3 py-4 text-emerald-300">Sin pendientes. Todo el equipo está en regla.</p>` : html`<ul className="flex flex-col gap-3">
          ${alertas.map((it) => html`<li key=${it.id} className="flex gap-3 rounded-md border border-slate-700 bg-slate-900 p-3">
            <div className=${cn('w-1 shrink-0 rounded-full', it.estado === E_REV ? 'bg-red-500' : 'bg-amber-500')}></div>
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-2"><span className="font-mono text-xs text-slate-500">${it.id}</span><span className="font-semibold">${it.nombre}</span></div>
              <div className="mt-1"><${Chip} estado=${it.estado} small /></div>
              <p className="mt-2 whitespace-pre-line text-sm text-slate-300">${cleanMant(it.mant) || 'Sin detalle. Abre el equipo para anotar qué falta revisar.'}</p>
              <div className="mt-3 flex flex-wrap gap-2">
                <button className=${cn(B_GHOST, 'min-h-[40px]')} onClick=${() => openEdit(it)}><${Icon} name="Pencil" size=${16} />Editar</button>
                <button className=${cn(B_OK, 'min-h-[40px]')} onClick=${() => { A.resolveItem(it.id); showToast(it.id + ' marcado como resuelto'); }}><${Icon} name="Check" size=${16} />Resuelto</button>
              </div>
            </div>
          </li>`)}
        </ul>`}
      </section>

      <section className=${cn(CARD, 'min-w-0 p-4 sm:p-5')} aria-label="Copropiedad y préstamos">
        <h2 className="mb-3 font-display text-2xl font-semibold uppercase">Copropiedad y préstamos</h2>
        <div className="lbl mb-2">Copropiedad</div>
        ${copro.length === 0 ? html`<p className="mb-4 text-sm text-slate-500">No hay equipos en copropiedad.</p>` : html`<ul className="mb-5 flex flex-col gap-3">${copro.map((it) => {
          const socio = primerNombre(socioDe(it));
          const conSocio = it.estado === E_PARTNER;
          return html`<li key=${it.id} className="rounded-md border border-slate-700 bg-slate-900 p-3">
            <div className="font-semibold">${it.nombre} <span className="font-normal text-slate-400">· ${it.marca} ${it.modelo.split('/')[0].trim()}</span></div>
            <div className="text-xs text-slate-500">${it.propiedad}</div>
            <div className="lbl mt-3 mb-1.5">¿Quién la tiene hoy?</div>
            <div className="grid grid-cols-2 gap-2">
              <button onClick=${() => A.setHolder(it.id, 'tai')} aria-pressed=${!conSocio} className=${cn('min-h-[48px] rounded-md border-2 font-semibold', !conSocio ? 'border-emerald-500 bg-emerald-500 text-slate-950' : 'border-slate-600 text-slate-300 hover:bg-slate-700/60')}>${db.yo ? primerNombre(db.yo) : 'Yo'}</button>
              <button onClick=${() => A.setHolder(it.id, 'socio')} aria-pressed=${conSocio} className=${cn('min-h-[48px] rounded-md border-2 font-semibold', conSocio ? 'border-amber-500 bg-amber-500 text-slate-950' : 'border-slate-600 text-slate-300 hover:bg-slate-700/60')}>${socio}</button>
            </div>
          </li>`; })}</ul>`}

        <div className="lbl mb-2">Prestados a mí</div>
        ${recibidos.length === 0 ? html`<p className="mb-4 text-sm text-slate-500">Nada prestado por ahora.</p>` : html`<ul className="mb-5 flex flex-col gap-2">${recibidos.map((it) => html`<li key=${it.id} className="flex flex-wrap items-center justify-between gap-2 rounded-md border border-slate-700 bg-slate-900 p-3"><div className="min-w-0"><div className="font-semibold">${it.nombre}</div><div className="text-xs text-slate-400">${it.propiedad}</div></div><${Chip} estado=${it.estado} small /></li>`)}</ul>`}

        <div className="mb-2 flex items-center justify-between"><span className="lbl">Disponibles para incluir en rodajes</span>
          <button onClick=${() => setLoanForm(!loanForm)} className="flex min-h-[40px] items-center gap-1 px-2 text-sm text-amber-400 hover:underline"><${Icon} name=${loanForm ? 'X' : 'Plus'} size=${16} />${loanForm ? 'Cancelar' : 'Registrar'}</button></div>

          <input id="ln-nombre" aria-label="Qué es" className=${INPUT} placeholder="Qué es (ej. Claqueta)" value=${ln.nombre} onChange=${(e) => setLn({ ...ln, nombre: e.target.value })} />
          <${NamePicker} id="ln-dueno" value=${ln.dueno} options=${db.personas} onChange=${(v) => setLn((c) => ({ ...c, dueno: v }))} onAdd=${A.addPersona} placeholder="¿De quién es?" />
          <button type="submit" className=${cn(B_PRIMARY, 'sm:col-span-2')}>Guardar préstamo</button></form>`}
        ${db.loans.length === 0 ? html`<p className="text-sm text-slate-500">Sin registros.</p>` : html`<ul className="flex flex-col gap-2">${db.loans.map((l) => html`<li key=${l.id} className="flex items-center justify-between gap-2 rounded-md border border-slate-700 bg-slate-900 p-3"><div className="min-w-0"><div className="font-semibold">${l.nombre}</div><div className="text-xs text-slate-400">Prestada por ${l.dueno}${l.notas ? ' · ' + l.notas : ''}</div></div><button aria-label=${'Quitar ' + l.nombre} onClick=${() => A.removeLoan(l.id)} className="flex h-11 w-11 shrink-0 items-center justify-center rounded-md text-slate-400 hover:bg-slate-700"><${Icon} name="Trash2" size=${16} /></button></li>`)}</ul>`}
      </section>
    </div>
  </div>`;
}


/* ---------- Categorías editables ---------- */
function CategoriesManager({ db, A, showToast, onClose }) {
  const [nueva, setNueva] = useState('');
  const [edit, setEdit] = useState(null);      // { old, val }
  const [confirmDel, setConfirmDel] = useState(null);
  const n = (c) => db.inventory.filter((i) => i.categoria === c).length;
  const orphans = uniq(db.inventory.map((i) => i.categoria)).filter((c) => c && !db.categorias.includes(c));
  const add = (e) => {
    e.preventDefault();
    const c = nueva.replace(/\s+/g, ' ').trim();
    if (!c) return;
    if (db.categorias.some((x) => normName(x) === normName(c))) return showToast('Esa categoría ya existe');
    A.addCategoria(c); setNueva(''); showToast('Categoría agregada: ' + c);
  };
  const saveRename = () => {
    const c = edit.val.replace(/\s+/g, ' ').trim();
    if (!c) return;
    if (db.categorias.some((x) => x !== edit.old && normName(x) === normName(c))) return showToast('Ya existe una categoría con ese nombre');
    A.renameCategoria(edit.old, c); setEdit(null); showToast('Categoría renombrada');
  };
  return html`<${Modal} title="Categorías de equipo" onClose=${onClose}>
    <p className="mb-4 text-sm text-slate-400">Agrega, renombra o elimina categorías. Al renombrar, los equipos de esa categoría se actualizan solos. Si eliminas una categoría que tiene equipos, ellos no se borran: conservan su categoría y puedes reasignarlos al editarlos. Sugerencia: empieza el nombre con un número (“9. Audio”) para mantener el orden.</p>
    <ul className="mb-4 flex flex-col gap-2">${db.categorias.map((c) => html`<li key=${c} className="rounded-md border border-slate-700 bg-slate-900 p-3">
      ${edit && edit.old === c ? html`<div className="flex flex-wrap items-center gap-2"><input aria-label="Nuevo nombre" autoFocus className=${cn(INPUT, 'min-w-0 flex-1')} value=${edit.val} onChange=${(e) => setEdit({ old: c, val: e.target.value })} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); saveRename(); } }} /><button onClick=${saveRename} className=${cn(B_PRIMARY, '!min-h-[40px] text-sm')}>Guardar</button><button onClick=${() => setEdit(null)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}>Cancelar</button></div>`
      : html`<div className="flex flex-wrap items-center gap-3"><div className="min-w-0 flex-1"><div className="font-semibold">${c}</div><div className="text-xs text-slate-400">${n(c)} equipo${n(c) === 1 ? '' : 's'}</div></div>
        <button onClick=${() => setEdit({ old: c, val: c })} aria-label=${'Renombrar ' + c} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}><${Icon} name="Pencil" size=${16} />Renombrar</button>
        <button onClick=${() => setConfirmDel(c)} aria-label=${'Eliminar ' + c} className=${cn(B_DANGER, '!min-h-[40px] text-sm')}><${Icon} name="Trash2" size=${16} /></button></div>`}
      ${confirmDel === c && html`<div className="mt-3 flex flex-wrap items-center gap-2 text-sm text-red-200">${n(c) ? '¿Eliminar la categoría? Sus ' + n(c) + ' equipos se conservan.' : '¿Eliminar esta categoría?'} <button onClick=${() => { A.deleteCategoria(c); setConfirmDel(null); showToast('Categoría eliminada'); }} className=${cn(B_DANGER, '!min-h-[40px] text-sm')}>Sí, eliminar</button><button onClick=${() => setConfirmDel(null)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}>No</button></div>`}
    </li>`)}</ul>
    ${db.categorias.length === 0 && html`<p className="mb-4 text-sm text-slate-400">No hay categorías. Agrega la primera abajo.</p>`}
    ${orphans.length > 0 && html`<p className="mb-4 rounded-md border border-amber-500/40 bg-amber-500/10 px-3 py-2 text-sm text-amber-200">Equipos con categoría que ya no está en la lista: ${orphans.join(', ')}. Se conservan; edítalos para moverlos a otra categoría.</p>`}
    <form onSubmit=${add} className="flex flex-wrap gap-2 border-t border-slate-700 pt-4"><input aria-label="Nueva categoría" className=${cn(INPUT, 'min-w-0 flex-1')} placeholder="Nueva categoría (ej. 9. Audio)" value=${nueva} onChange=${(e) => setNueva(e.target.value)} /><button type="submit" className=${B_PRIMARY}><${Icon} name="Plus" size=${16} />Agregar</button></form>
  <//>`;
}

/* ---------- INVENTARIO ---------- */
function Inventory({ db, filters, setFilters, A, showToast, edit, setEdit }) {
  const [catsOpen, setCatsOpen] = useState(false);
  const [mode, setMode] = useState(() => (window.innerWidth >= 1024 ? 'table' : 'cards'));
  const [confirmDel, setConfirmDel] = useState(null);
  const cats = useMemo(() => uniq(db.inventory.map((i) => i.categoria)).sort(numCmp), [db.inventory]);
  const props = useMemo(() => uniq(db.inventory.map((i) => i.propiedad)), [db.inventory]);
  const list = useMemo(() => {
    const q = filters.q.trim().toLowerCase();
    return db.inventory.filter((i) => {
      if (filters.cat && i.categoria !== filters.cat) return false;
      if (filters.estado && i.estado !== filters.estado) return false;
      if (filters.prop && i.propiedad !== filters.prop) return false;
      if (q && ![i.id, i.nombre, i.marca, i.modelo].join(' ').toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => numCmp(a.id, b.id));
  }, [db.inventory, filters]);
  const active = filters.q || filters.cat || filters.estado || filters.prop;
  const setF = (k) => (e) => setFilters({ ...filters, [k]: e.target.value });
  const del = (id) => { A.deleteItem(id); setConfirmDel(null); showToast(id + ' eliminado'); };

  const DelBtn = ({ it }) => confirmDel === it.id
    ? html`<span className="flex items-center gap-1"><button onClick=${() => del(it.id)} className=${cn(B_DANGER, 'min-h-[40px] px-3')}>Eliminar</button><button onClick=${() => setConfirmDel(null)} className=${cn(B_GHOST, 'min-h-[40px] px-3')}>No</button></span>`
    : html`<button aria-label=${'Eliminar ' + it.id} onClick=${() => setConfirmDel(it.id)} className="flex h-11 w-11 items-center justify-center rounded-md text-slate-400 hover:bg-red-500/15 hover:text-red-300"><${Icon} name="Trash2" size=${17} /></button>`;
  const EditBtn = ({ it }) => html`<button aria-label=${'Editar ' + it.id} onClick=${() => setEdit(it)} className="flex h-11 w-11 items-center justify-center rounded-md text-slate-300 hover:bg-slate-700"><${Icon} name="Pencil" size=${17} /></button>`;

  return html`<div>
    <${PageTitle} eyebrow=${list.length + ' de ' + db.inventory.length + ' equipos'} title="Inventario maestro" right=${html`<div className="flex flex-wrap gap-2"><button className=${B_GHOST} onClick=${() => setCatsOpen(true)}><${Icon} name="Tags" />Categorías</button><button className=${B_PRIMARY} onClick=${() => setEdit('new')}><${Icon} name="Plus" />Agregar equipo</button></div>`} />
    ${catsOpen && html`<${CategoriesManager} db=${db} A=${A} showToast=${showToast} onClose=${() => setCatsOpen(false)} />`}
    <div className=${cn(CARD, 'mb-4 grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 xl:grid-cols-5')}>
      <div className="relative sm:col-span-2 xl:col-span-2"><span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><${Icon} name="Search" size=${18} /></span>
        <input id="inv-q" aria-label="Buscar equipo" className=${cn(INPUT, 'pl-10')} placeholder="Buscar por nombre, marca, modelo o ID" value=${filters.q} onChange=${setF('q')} /></div>
      <select aria-label="Filtrar por categoría" className=${INPUT} value=${filters.cat} onChange=${setF('cat')}><option value="">Todas las categorías</option>${cats.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select>
      <select aria-label="Filtrar por estado" className=${INPUT} value=${filters.estado} onChange=${setF('estado')}><option value="">Todos los estados</option>${ESTADOS.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select>
      <select aria-label="Filtrar por propiedad" className=${INPUT} value=${filters.prop} onChange=${setF('prop')}><option value="">Toda la propiedad</option>${props.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select>
      <div className="flex gap-2 sm:col-span-2 xl:col-span-5">
        <div className="inline-flex overflow-hidden rounded-md border border-slate-600" role="group" aria-label="Tipo de vista">
          <button onClick=${() => setMode('table')} aria-pressed=${mode === 'table'} className=${cn('flex min-h-[44px] items-center gap-2 px-4 text-sm font-semibold', mode === 'table' ? 'bg-amber-500 text-slate-950' : 'text-slate-300 hover:bg-slate-700/60')}><${Icon} name="Table" size=${16} />Tabla</button>
          <button onClick=${() => setMode('cards')} aria-pressed=${mode === 'cards'} className=${cn('flex min-h-[44px] items-center gap-2 border-l border-slate-600 px-4 text-sm font-semibold', mode === 'cards' ? 'bg-amber-500 text-slate-950' : 'text-slate-300 hover:bg-slate-700/60')}><${Icon} name="LayoutGrid" size=${16} />Tarjetas</button>
        </div>
        ${active && html`<button onClick=${() => setFilters({ q: '', cat: '', estado: '', prop: '' })} className=${B_GHOST}><${Icon} name="X" size=${16} />Limpiar filtros</button>`}
      </div>
    </div>

    ${list.length === 0 ? html`<${Empty} icon="Search" title="Sin resultados" text="Ningún equipo coincide con esos filtros. Prueba con otra búsqueda o limpia los filtros." />` :
    mode === 'table' ? html`<div className=${cn(CARD, 'overflow-x-auto')}>
      <table className="w-full min-w-[980px] text-left text-sm">
        <thead><tr className="border-b border-slate-700 bg-slate-900/60 text-slate-400">${['ID', 'Equipo', 'Cant.', 'Estado actual', 'Propiedad', 'Notas', ''].map((h) => html`<th key=${h} className="lbl px-3 py-3 font-normal">${h}</th>`)}</tr></thead>
        <tbody>${list.map((it) => html`<tr key=${it.id} className="border-b border-slate-700/60 align-top hover:bg-slate-700/20">
          <td className="px-3 py-3 font-mono text-xs text-slate-400">${it.id}</td>
          <td className="max-w-[330px] px-3 py-3"><div className="flex items-start gap-3"><${Thumb} item=${it} /><div className="min-w-0"><div className="font-semibold">${it.nombre}</div><div className="text-xs text-slate-400">${it.marca} · ${it.modelo}</div><div className="mt-0.5 text-xs text-slate-500">${it.categoria}</div></div></div></td>
          <td className="num px-3 py-3">${it.cantidad}</td>
          <td className="w-[210px] px-3 py-3"><${EstadoSelect} value=${it.estado} onChange=${(v) => A.setEstado(it.id, v)} /></td>
          <td className="max-w-[170px] px-3 py-3 text-xs text-slate-300">${it.propiedad}</td>
          <td className="max-w-[280px] px-3 py-3 text-xs text-slate-400"><div className="line-clamp-2">${it.notas}</div>${it.mant && html`<div className="mt-1 whitespace-pre-line text-amber-300">${cleanMant(it.mant)}</div>`}</td>
          <td className="px-3 py-2"><div className="flex items-center justify-end"><${EditBtn} it=${it} /><${DelBtn} it=${it} /></div></td>
        </tr>`)}</tbody>
      </table></div>` : html`<div className="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3">${list.map((it) => html`<article key=${it.id} className=${cn(CARD, 'flex min-w-0 flex-col gap-3 p-4')}>
        <div className="flex items-start justify-between gap-2"><${Thumb} item=${it} /><div className="min-w-0 flex-1"><div className="font-mono text-xs text-slate-500">${it.id} · ${it.categoria}</div><h3 className="font-sans text-base font-semibold leading-snug normal-case tracking-normal">${it.nombre}</h3><div className="text-xs text-slate-400">${it.marca} · ${it.modelo}</div></div><span className="num shrink-0 rounded bg-slate-900 px-2 py-1 font-mono text-xs">x${it.cantidad}</span></div>
        <${EstadoSelect} value=${it.estado} onChange=${(v) => A.setEstado(it.id, v)} />
        <div className="text-xs text-slate-300">${it.propiedad}</div>
        ${it.notas && html`<p className="line-clamp-3 text-xs text-slate-400">${it.notas}</p>`}
        ${it.mant && html`<p className="whitespace-pre-line rounded border border-amber-500/30 bg-amber-500/10 px-2 py-1.5 text-xs text-amber-300">${cleanMant(it.mant)}</p>`}
        <div className="mt-auto flex items-center justify-end border-t border-slate-700 pt-2"><${EditBtn} it=${it} /><${DelBtn} it=${it} /></div>
      </article>`)}</div>`}
  </div>`;
}

/* ---------- PROYECTOS ---------- */
function ProjectForm({ project, onClose, onSave }) {
  const [f, setF] = useState(project ? { nombre: project.nombre, fechas: project.fechas || '', locacion: project.locacion || '', tipo: project.tipo || '' } : { nombre: '', fechas: '', locacion: '', tipo: '' });
  const [err, setErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => { e.preventDefault(); if (!f.nombre.trim()) return setErr('Escribe el nombre de la producción.'); onSave({ ...f, nombre: f.nombre.trim() }); };
  return html`<${Modal} title=${project ? 'Editar proyecto' : 'Nuevo proyecto'} onClose=${onClose}>
    <form onSubmit=${submit} className="grid grid-cols-1 gap-4">
      <${Field} id="p-nombre" label="Producción / proyecto"><input id="p-nombre" autoFocus className=${INPUT} value=${f.nombre} onChange=${set('nombre')} placeholder="Ej. Cortometraje «La última función»" /><//>
      <${Field} id="p-fechas" label="Fecha(s) de rodaje"><input id="p-fechas" className=${INPUT} value=${f.fechas} onChange=${set('fechas')} placeholder="Ej. 24 y 25 de octubre" /><//>
      <${Field} id="p-loc" label="Locación"><input id="p-loc" className=${INPUT} value=${f.locacion} onChange=${set('locacion')} placeholder="Ej. Casa de Escazú, interior noche" /><//>
      <${Field} id="p-tipo" label="Tipo de proyecto / notas de producción"><textarea id="p-tipo" rows="3" className=${INPUT} value=${f.tipo} onChange=${set('tipo')} placeholder="Ej. Corto de ficción, 2 jornadas, crew de 4" /><//>
      ${err && html`<p className="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">${err}</p>`}
      <div className="flex flex-wrap justify-end gap-3"><button type="button" onClick=${onClose} className=${B_GHOST}>Cancelar</button><button type="submit" className=${B_PRIMARY}><${Icon} name="Save" />${project ? 'Guardar' : 'Crear proyecto'}</button></div>
    </form><//>`;
}

function Projects({ db, A, openProject, openNew, setOpenNew, showToast }) {
  const [confirmDel, setConfirmDel] = useState(null);
  const activos = db.projects.filter((p) => p.estado !== 'Finalizado');
  const finales = db.projects.filter((p) => p.estado === 'Finalizado');
  const Card = ({ p }) => {
    const pr = progress(p, db);
    return html`<article className=${cn(CARD, 'flex min-w-0 flex-col overflow-hidden')}>
      <div className=${cn('h-1.5', p.estado === 'Finalizado' ? 'bg-slate-600' : 'clap')}></div>
      <div className="flex flex-1 flex-col gap-3 p-4">
        <div><h3 className="font-display text-2xl font-bold uppercase leading-tight">${p.nombre}</h3><p className="text-sm text-slate-400">${[p.fechas, p.locacion].filter(Boolean).join(' · ') || 'Sin fecha ni locación'}</p>${p.tipo && html`<p className="mt-1 line-clamp-2 text-xs text-slate-500">${p.tipo}</p>`}</div>
        <div className="grid grid-cols-2 gap-3 text-xs">
          <div><div className="lbl mb-1">Prep ${pct(pr.prep, pr.total)}%</div><${Bar} value=${pr.prep} total=${pr.total} /></div>
          <div><div className="lbl mb-1">Wrap ${pct(pr.wrap, pr.total)}%</div><${Bar} value=${pr.wrap} total=${pr.total} tone="emerald" /></div>
        </div>
        <div className="text-xs text-slate-400">${pr.total} equipos · ${pr.units} unidades</div>
        <div className="mt-auto flex flex-wrap items-center gap-2 border-t border-slate-700 pt-3">
          <button onClick=${() => openProject(p.id, 1)} className=${cn(B_PRIMARY, 'flex-1')}>Abrir<${Icon} name="ChevronRight" size=${16} /></button>
          ${confirmDel === p.id ? html`<button onClick=${() => { A.deleteProject(p.id); setConfirmDel(null); showToast('Proyecto eliminado'); }} className=${B_DANGER}>Eliminar</button><button onClick=${() => setConfirmDel(null)} className=${B_GHOST}>No</button>` : html`<button aria-label=${'Eliminar ' + p.nombre} onClick=${() => setConfirmDel(p.id)} className="flex h-11 w-11 items-center justify-center rounded-md text-slate-400 hover:bg-red-500/15 hover:text-red-300"><${Icon} name="Trash2" size=${17} /></button>`}
        </div>
      </div></article>`;
  };
  const create = (f) => { const id = 'PRJ-' + uid(); A.addProject({ id, ...f, estado: 'Activo', seleccion: {}, prep: {}, wrap: {}, flagged: {}, creado: Date.now() }); setOpenNew(false); showToast('Proyecto creado'); openProject(id, 1); };
  return html`<div>
    <${PageTitle} eyebrow=${db.projects.length + ' producciones'} title="Proyectos" right=${html`<button className=${B_PRIMARY} onClick=${() => setOpenNew(true)}><${Icon} name="Plus" />Crear nuevo proyecto</button>`} />
    ${db.projects.length === 0 && html`<${Empty} icon="Clapperboard" title="Aún no hay rodajes" text="Crea un proyecto, elige el equipo con los kits rápidos y usa PREP y WRAP el día del rodaje." action=${html`<button className=${B_PRIMARY} onClick=${() => setOpenNew(true)}><${Icon} name="Plus" />Crear nuevo proyecto</button>`} />`}
    ${activos.length > 0 && html`<h2 className="lbl mb-3">Activos · ${activos.length}</h2><div className="mb-8 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">${activos.map((p) => html`<${Card} key=${p.id} p=${p} />`)}</div>`}
    ${finales.length > 0 && html`<h2 className="lbl mb-3">Finalizados · ${finales.length}</h2><div className="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">${finales.map((p) => html`<${Card} key=${p.id} p=${p} />`)}</div>`}
    ${openNew && html`<${ProjectForm} onClose=${() => setOpenNew(false)} onSave=${create} />`}
  </div>`;
}

/* ---------- DETALLE DE PROYECTO ---------- */

function Phase1({ project, db, A, showToast, onNext }) {
  const [q, setQ] = useState('');
  const [showExport, setShowExport] = useState(false);
  const all = useMemo(() => [...db.inventory, ...db.loans.map(loanAsItem)], [db.inventory, db.loans]);
  const shown = all.filter((i) => !q.trim() || [i.id, i.nombre, i.marca, i.modelo].join(' ').toLowerCase().includes(q.trim().toLowerCase()));
  const groups = groupBy(shown, (i) => i.categoria);
  const pr = progress(project, db);
  const [kitEdit, setKitEdit] = useState(null);
  const [manageKits, setManageKits] = useState(false);
  const applyKit = (kit) => {
    const ids = kit.ids.filter((id) => { const it = all.find((x) => x.id === id); return it && it.estado !== E_SOLD; });
    A.updateProject(project.id, (p) => {
      const s = { ...p.seleccion };
      ids.forEach((id) => { if (!s[id]) s[id] = all.find((x) => x.id === id).cantidad || 1; });
      return { ...p, seleccion: s };
    });
    showToast(ids.length ? kit.nombre + ' agregado' : 'Ese kit no tiene equipos disponibles');
  };
  const selectable = shown.filter((i) => i.estado !== E_SOLD);
  const allShownSel = selectable.length > 0 && selectable.every((i) => project.seleccion[i.id]);
  const anyShownSel = shown.some((i) => project.seleccion[i.id]);
  const markAll = () => { A.updateProject(project.id, (p) => { const s = { ...p.seleccion }; selectable.forEach((i) => { if (!s[i.id]) s[i.id] = i.cantidad || 1; }); return { ...p, seleccion: s }; }); showToast(selectable.length + ' equipos marcados'); };
  const unmarkAll = () => { A.updateProject(project.id, (p) => { const s = { ...p.seleccion }; shown.forEach((i) => { delete s[i.id]; }); return { ...p, seleccion: s }; }); showToast(q.trim() ? 'Equipos de la búsqueda desmarcados' : 'Todos los equipos desmarcados'); };
  const setQty = (key, qty) => A.updateProject(project.id, (p) => { const s = { ...p.seleccion }; if (qty <= 0) delete s[key]; else s[key] = qty; return { ...p, seleccion: s }; });

  return html`<div>
    <div className=${cn(CARD, 'mb-4 p-4')}>
      <div className="mb-2 flex flex-wrap items-center justify-between gap-2"><div className="lbl">Kits rápidos</div>
        <div className="flex flex-wrap gap-2"><button onClick=${() => setKitEdit({ nombre: '', icon: 'Package', ids: Object.keys(project.seleccion) })} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}><${Icon} name="Plus" size=${16} />Nuevo kit</button><button onClick=${() => setManageKits(true)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}><${Icon} name="Pencil" size=${16} />Editar kits</button></div></div>
      ${db.kits.length === 0 && html`<p className="text-sm text-slate-400">No hay kits. Crea uno nuevo en “Editar kits”.</p>`}
      <div className="grid grid-cols-1 gap-2 md:grid-cols-3">${db.kits.map((k) => html`<button key=${k.id} onClick=${() => applyKit(k)} className=${cn(B_GHOST, 'justify-start text-left')}><${Icon} name=${k.icon} className="shrink-0 text-amber-400" /><span className="min-w-0 flex-1">${k.nombre}</span><span className="num text-xs text-slate-500">${k.ids.length}</span></button>`)}</div>
      <div className="mt-4 flex flex-wrap items-center gap-3">
        <div className="relative min-w-[200px] flex-1"><span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><${Icon} name="Search" size=${18} /></span><input id="sel-q" aria-label="Buscar en el catálogo" className=${cn(INPUT, 'pl-10')} placeholder="Buscar en el catálogo" value=${q} onChange=${(e) => setQ(e.target.value)} /></div>
        <button onClick=${markAll} disabled=${allShownSel || selectable.length === 0} className=${B_GHOST}><${Icon} name="ListChecks" size=${16} />${q.trim() ? 'Marcar resultados' : 'Marcar todos'}</button>
        <button onClick=${unmarkAll} disabled=${!anyShownSel} className=${B_GHOST}><${Icon} name="RotateCcw" size=${16} />${q.trim() ? 'Desmarcar resultados' : 'Desmarcar todos'}</button>
        <button onClick=${() => setShowExport(true)} disabled=${pr.total === 0} className=${B_GHOST}><${Icon} name="Share2" size=${16} />Exportar lista de equipo</button>
      </div>
      <div className="num mt-3 text-sm text-slate-300"><span className="font-display text-2xl font-semibold text-amber-400">${pr.total}</span> equipos elegidos · ${pr.units} unidades</div>
    </div>

    <${RentalSection} project=${project} db=${db} A=${A} showToast=${showToast} />

    ${groups.map(([cat, items]) => html`<section key=${cat} className="mb-5"><h2 className="lbl mb-2 flex items-center gap-2"><span className="h-px w-4 bg-amber-500"></span>${cat}</h2>
      <ul className=${cn(CARD, 'divide-y divide-slate-700')}>${items.map((it) => {
        const sel = project.seleccion[it.id];
        const av = aviso(it);
        const sold = it.estado === E_SOLD;
        return html`<li key=${it.id} className=${cn('flex flex-wrap items-center gap-3 p-3', sold && 'opacity-50')}>
          <input id=${'chk-' + it.id} type="checkbox" disabled=${sold} checked=${!!sel} onChange=${(e) => setQty(it.id, e.target.checked ? it.cantidad : 0)} className="h-7 w-7 shrink-0 accent-amber-500" />
          <${Thumb} item=${it} size=${40} />
          <label htmlFor=${'chk-' + it.id} className="min-w-0 flex-1 cursor-pointer py-1">
            <div className="flex flex-wrap items-center gap-2"><span className="font-semibold">${it.nombre}</span><${Chip} estado=${it.estado} small /></div>
            <div className="text-xs text-slate-400">${[it.marca, it.modelo].filter(Boolean).join(' · ')}</div>
            ${av && html`<div className=${cn('mt-1.5 inline-block rounded border px-2 py-1 text-xs', AV_TONE[av.tone])}>${av.text}</div>`}
          </label>
          ${sel && it.cantidad > 1 && html`<div className="flex items-center gap-1" aria-label="Cantidad a llevar">
            <button aria-label="Menos" onClick=${() => setQty(it.id, Math.max(1, sel - 1))} className="flex h-11 w-11 items-center justify-center rounded-md border border-slate-600 hover:bg-slate-700"><${Icon} name="Minus" size=${16} /></button>
            <span className="num w-14 text-center font-mono text-sm">${sel} / ${it.cantidad}</span>
            <button aria-label="Más" onClick=${() => setQty(it.id, Math.min(it.cantidad, sel + 1))} className="flex h-11 w-11 items-center justify-center rounded-md border border-slate-600 hover:bg-slate-700"><${Icon} name="Plus" size=${16} /></button></div>`}
        </li>`; })}</ul></section>`)}

    ${groups.length === 0 && html`<${Empty} icon="Search" title="Sin resultados" text="Ningún equipo coincide con la búsqueda." />`}
    <div className="mt-2 flex justify-end"><button onClick=${onNext} disabled=${pr.total === 0} className=${B_PRIMARY}>Siguiente: modo PREP<${Icon} name="ChevronRight" size=${16} /></button></div>
    ${showExport && html`<${ExportModal} text=${exportText(project, db)} onClose=${() => setShowExport(false)} showToast=${showToast} />`}
    ${manageKits && html`<${KitsManager} db=${db} A=${A} showToast=${showToast} onEdit=${(k) => { setManageKits(false); setKitEdit(k); }} onClose=${() => setManageKits(false)} />`}
    ${kitEdit && html`<${KitForm} kit=${kitEdit} all=${all} onClose=${() => setKitEdit(null)} onSave=${(k) => { A.saveKit(k); setKitEdit(null); showToast('Kit guardado: ' + k.nombre); }} />`}
  </div>`;
}

function KitsManager({ db, A, showToast, onEdit, onClose }) {
  const [confirmDel, setConfirmDel] = useState(null);
  const name = (id) => { const it = db.inventory.find((x) => x.id === id) || db.loans.find((x) => x.id === id); return it ? it.nombre : null; };
  return html`<${Modal} title="Kits rápidos" onClose=${onClose}>
    <p className="mb-4 text-sm text-slate-400">Modifica, elimina o crea kits. Los cambios no alteran el inventario ni los proyectos ya trabajados, y se guardan en el respaldo JSON.</p>
    <ul className="mb-4 flex flex-col gap-2">${db.kits.map((k) => {
      const missing = k.ids.filter((id) => !name(id)).length;
      return html`<li key=${k.id} className="rounded-md border border-slate-700 bg-slate-900 p-3">
        <div className="flex flex-wrap items-center gap-3">
          <${Icon} name=${k.icon} className="shrink-0 text-amber-400" />
          <div className="min-w-0 flex-1"><div className="font-semibold">${k.nombre}</div><div className="text-xs text-slate-400">${k.ids.length} equipos${missing ? ' · ' + missing + ' ya no están en el inventario' : ''}</div></div>
          <button onClick=${() => onEdit(k)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}><${Icon} name="Pencil" size=${16} />Editar</button>
          <button onClick=${() => setConfirmDel(k.id)} aria-label=${'Eliminar ' + k.nombre} className=${cn(B_DANGER, '!min-h-[40px] text-sm')}><${Icon} name="Trash2" size=${16} /></button>
        </div>
        ${confirmDel === k.id && html`<div className="mt-3 flex flex-wrap items-center gap-2 text-sm text-red-200">¿Eliminar este kit? <button onClick=${() => { A.deleteKit(k.id); setConfirmDel(null); showToast('Kit eliminado'); }} className=${cn(B_DANGER, '!min-h-[40px] text-sm')}>Sí, eliminar</button><button onClick=${() => setConfirmDel(null)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}>Cancelar</button></div>`}
      </li>`; })}</ul>
    ${db.kits.length === 0 && html`<p className="mb-4 text-sm text-slate-400">No hay kits guardados.</p>`}
    <div className="flex flex-wrap justify-between gap-2 border-t border-slate-700 pt-4">
      <button onClick=${() => onEdit({ nombre: '', icon: 'Package', ids: [] })} className=${B_PRIMARY}><${Icon} name="Plus" size=${16} />Nuevo kit</button>
    </div>
  <//>`;
}

function KitForm({ kit, all, onClose, onSave }) {
  const [nombre, setNombre] = useState(kit.nombre || '');
  const [icon, setIcon] = useState(kit.icon || 'Package');
  const [ids, setIds] = useState(() => new Set(kit.ids || []));
  const [q, setQ] = useState('');
  const shown = all.filter((i) => !q.trim() || [i.id, i.nombre, i.marca, i.modelo].join(' ').toLowerCase().includes(q.trim().toLowerCase()));
  const groups = groupBy(shown, (i) => i.categoria);
  const toggle = (id) => setIds((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const setMany = (on) => setIds((s) => { const n = new Set(s); shown.forEach((i) => (on ? n.add(i.id) : n.delete(i.id))); return n; });
  const ok = nombre.trim() && ids.size > 0;
  const save = () => { if (ok) onSave({ id: kit.id || 'KIT-' + uid(), nombre: nombre.trim(), icon, ids: Array.from(ids) }); };
  return html`<${Modal} title=${kit.id ? 'Editar kit' : 'Nuevo kit'} onClose=${onClose}>
    <div className="flex flex-col gap-4">
      <${Field} id="kit-nombre" label="Nombre del kit"><input id="kit-nombre" className=${INPUT} value=${nombre} onChange=${(e) => setNombre(e.target.value)} placeholder="Ej. Kit Entrevista" /><//>
      <div><div className="lbl mb-1.5">Icono</div><div className="flex flex-wrap gap-2">${KIT_ICONS.map((n) => html`<button key=${n} type="button" onClick=${() => setIcon(n)} aria-label=${'Icono ' + n} aria-pressed=${icon === n} className=${cn('flex h-11 w-11 items-center justify-center rounded-md border', icon === n ? 'border-amber-500 bg-amber-500/15 text-amber-400' : 'border-slate-600 text-slate-300 hover:bg-slate-700')}><${Icon} name=${n} /></button>`)}</div></div>
      <div>
        <div className="mb-2 flex flex-wrap items-center justify-between gap-2"><div className="lbl">Equipos (${ids.size})</div>
          <div className="flex gap-2"><button type="button" onClick=${() => setMany(true)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}>Marcar todos</button><button type="button" onClick=${() => setMany(false)} className=${cn(B_GHOST, '!min-h-[40px] text-sm')}>Desmarcar todos</button></div></div>
        <input id="kit-q" aria-label="Buscar equipo para el kit" className=${cn(INPUT, 'mb-2')} placeholder="Buscar equipo" value=${q} onChange=${(e) => setQ(e.target.value)} />
        <div className="max-h-[45vh] overflow-y-auto rounded-md border border-slate-700">${groups.map(([cat, items]) => html`<div key=${cat}><div className="lbl sticky top-0 bg-slate-800 px-3 py-1.5">${cat}</div>

function EmptyPhase({ onBack }) {
